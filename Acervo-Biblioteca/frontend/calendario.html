<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="IconeSH.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário — Stronghold Library</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #111;
      --surface:  #1a1a1a;
      --surface2: #222;
      --border:   #2a2a2a;
      --text:     #eee;
      --muted:    #666;
      --accent:   #ffd700;
      --radius:   8px;
    }

    body { background: var(--bg); color: var(--text); font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Topo ── */
    .topo {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      background: #000; border-bottom: 1px solid var(--border);
      flex-shrink: 0; flex-wrap: wrap;
    }
    .topo a { color: #aaa; text-decoration: none; font-size: 14px; }
    .topo a:hover { color: white; }
    .topo-titulo { font-size: 16px; font-weight: bold; flex: 1; }
    .nav-btn {
      background: var(--surface2); color: var(--text); border: none;
      border-radius: var(--radius); padding: 6px 12px; font-size: 13px;
      cursor: pointer; transition: background 0.15s;
    }
    .nav-btn:hover { background: #333; }
    .nav-btn.ativo { background: var(--accent); color: #111; font-weight: bold; }
    .periodo-label { font-size: 15px; font-weight: bold; min-width: 180px; text-align: center; }

    /* ── Layout principal ── */
    .cal-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

    /* ── Grade ── */
    .grade-wrap { flex: 1; overflow: auto; }
    .grade { display: grid; height: 100%; }

    /* ── Cabeçalho dos dias ── */
    .dias-header {
      display: grid; background: var(--surface);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .dia-header {
      padding: 8px 4px; text-align: center; font-size: 12px;
      color: var(--muted); border-right: 1px solid var(--border);
    }
    .dia-header.hoje { color: var(--accent); font-weight: bold; }

    /* ── Células ── */
    .celula {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 4px; min-height: 90px; position: relative;
      cursor: pointer; transition: background 0.1s;
      vertical-align: top;
    }
    .celula:hover { background: rgba(255,255,255,0.03); }
    .celula.outro-mes { opacity: 0.35; }
    .celula.hoje-cel { background: rgba(255,215,0,0.06); }

    .num-dia {
      font-size: 12px; color: var(--muted); margin-bottom: 3px;
      display: inline-block; width: 24px; height: 24px; line-height: 24px;
      text-align: center; border-radius: 50%;
    }
    .num-dia.hoje-num { background: var(--accent); color: #111; font-weight: bold; }

    /* ── Eventos na grade ── */
    .ev-pill {
      display: block; font-size: 11px; border-radius: 4px;
      padding: 2px 5px; margin-bottom: 2px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: #111; font-weight: 600;
      transition: opacity 0.15s;
    }
    .ev-pill:hover { opacity: 0.8; }
    .ev-mais { font-size: 10px; color: var(--muted); cursor: pointer; }
    .ev-mais:hover { color: var(--text); }

    /* ── Vista DIA / SEMANA — linha do tempo ── */
    .timeline { display: flex; flex: 1; overflow: auto; }
    .horas-col {
      width: 52px; flex-shrink: 0; border-right: 1px solid var(--border);
    }
    .hora-label {
      height: 60px; display: flex; align-items: flex-start;
      justify-content: flex-end; padding: 2px 6px 0 0;
      font-size: 11px; color: var(--muted);
    }
    .dias-cols { flex: 1; display: flex; overflow-x: auto; }
    .dia-col {
      flex: 1; min-width: 100px; border-right: 1px solid var(--border);
      position: relative; cursor: pointer;
    }
    .hora-slot {
      height: 60px; border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .hora-slot:hover { background: rgba(255,255,255,0.03); }
    .hora-slot.meia { border-bottom: 1px dashed rgba(255,255,255,0.05); height: 30px; }
    .ev-bloco {
      position: absolute; left: 3px; right: 3px;
      border-radius: 6px; padding: 3px 6px; font-size: 11px;
      color: #111; font-weight: 600; overflow: hidden;
      cursor: pointer; z-index: 2; transition: opacity 0.15s;
    }
    .ev-bloco:hover { opacity: 0.85; }

    /* ── Vista ANO ── */
    .ano-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 16px; padding: 16px; overflow-y: auto; flex: 1;
    }
    .mini-mes { background: var(--surface); border-radius: var(--radius); padding: 10px; }
    .mini-mes-titulo { font-size: 12px; font-weight: bold; margin-bottom: 8px; color: var(--accent); }
    .mini-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
    .mini-cel {
      font-size: 10px; text-align: center; padding: 2px;
      border-radius: 3px; cursor: pointer; color: var(--muted);
      transition: background 0.1s;
    }
    .mini-cel:hover { background: var(--surface2); color: var(--text); }
    .mini-cel.tem-ev { color: var(--text); font-weight: bold; }
    .mini-cel.hoje-m { background: var(--accent); color: #111; border-radius: 50%; }
    .mini-cel.outro { opacity: 0.25; }
    .mini-dia-header { font-size: 9px; color: var(--muted); text-align: center; }

    /* ── Modal de evento ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.aberto { display: flex; }
    .modal {
      background: var(--surface); border-radius: 14px;
      padding: 28px; width: 90%; max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
    }
    .modal h3 { margin: 0 0 18px; font-size: 16px; }
    .modal input, .modal textarea, .modal select {
      width: 100%; padding: 9px 12px; margin-bottom: 10px;
      background: var(--surface2); color: var(--text);
      border: 1px solid #444; border-radius: var(--radius);
      font-size: 14px; font-family: Arial, sans-serif;
    }
    .modal input:focus, .modal textarea:focus { outline: none; border-color: var(--accent); }
    .modal-row { display: flex; gap: 10px; }
    .modal-row > * { flex: 1; }
    .modal-btns { display: flex; gap: 8px; margin-top: 6px; justify-content: flex-end; }
    .btn-prim { background: var(--accent); color: #111; border: none; border-radius: var(--radius); padding: 8px 18px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-prim:hover { background: #ffe44d; }
    .btn-sec  { background: var(--surface2); color: var(--muted); border: none; border-radius: var(--radius); padding: 8px 14px; font-size: 14px; cursor: pointer; }
    .btn-sec:hover { background: #333; }
    .btn-del  { background: #3a1a1a; color: #f88; border: 1px solid #622; border-radius: var(--radius); padding: 8px 14px; font-size: 14px; cursor: pointer; }
    .btn-del:hover { background: #4a2020; }

    /* Cor do evento */
    .cores-ev { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .cor-ev { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.1s; }
    .cor-ev:hover { transform: scale(1.15); }
    .cor-ev.sel { border-color: white; transform: scale(1.1); }

    /* Linha de hora atual */
    .hora-atual-linha {
      position: absolute; left: 0; right: 0; height: 2px;
      background: #ef4444; z-index: 3; pointer-events: none;
    }
    .hora-atual-linha::before {
      content: ""; position: absolute; left: -4px; top: -4px;
      width: 10px; height: 10px; border-radius: 50%; background: #ef4444;
    }

    @media (max-width: 600px) {
      .ano-grid { grid-template-columns: repeat(2, 1fr); }
      .periodo-label { min-width: 120px; font-size: 13px; }
      .nav-btn { padding: 5px 8px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="topo">
  <a href="index.html">← Início</a>
  <span class="topo-titulo">📅 Calendário</span>

  <button class="nav-btn" id="btn-hoje" onclick="irHoje()">Hoje</button>
  <button class="nav-btn" onclick="navegar(-1)">‹</button>
  <span class="periodo-label" id="periodo-label"></span>
  <button class="nav-btn" onclick="navegar(1)">›</button>

  <div style="display:flex;gap:6px;margin-left:auto;">
    <button class="nav-btn" id="vm-dia"    onclick="setVista('dia')">Dia</button>
    <button class="nav-btn" id="vm-semana" onclick="setVista('semana')">Semana</button>
    <button class="nav-btn ativo" id="vm-mes" onclick="setVista('mes')">Mês</button>
    <button class="nav-btn" id="vm-ano"    onclick="setVista('ano')">Ano</button>
  </div>

  <button class="btn-prim" onclick="abrirModal(null)" style="white-space:nowrap;">+ Evento</button>
</div>

<div class="cal-body" id="cal-body"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="fecharModalOverlay(event)">
  <div class="modal">
    <h3 id="modal-titulo">Novo Evento</h3>
    <input  id="ev-nome"     placeholder="Título do evento" maxlength="100">
    <div class="modal-row">
      <input id="ev-data"    type="date">
      <input id="ev-hora-ini" type="time" value="09:00">
    </div>
    <div class="modal-row">
      <input id="ev-data-fim" type="date">
      <input id="ev-hora-fim" type="time" value="10:00">
    </div>
    <textarea id="ev-desc" placeholder="Descrição (opcional)" rows="2"></textarea>
    <div class="cores-ev" id="cores-ev"></div>
    <div class="modal-btns">
      <button class="btn-del" id="btn-del-ev" onclick="deletarEvento()" style="display:none">🗑 Excluir</button>
      <button class="btn-sec" onclick="fecharModal()">Cancelar</button>
      <button class="btn-prim" onclick="salvarEvento()">Salvar</button>
    </div>
  </div>
</div>

<script>
// ── Supabase ──
const _supa = supabase.createClient(
  "https://iwggwgepwbrvmmrgsrvr.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3Z2d3Z2Vwd2Jydm1tcmdzcnZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1Mzc4ODcsImV4cCI6MjA4OTExMzg4N30.BFaHUNavW7VOApg35r01SHsfjgYKUnhlT7YSADF9H6U"
)

// ── Estado ──
let userId    = null
let hoje      = new Date()
let cursor    = new Date(hoje)  // data de navegação
let vista     = "mes"
let eventos   = []              // [{ id, titulo, desc, inicio, fim, cor }]
let evEditing = null            // id do evento sendo editado
let corAtual  = "#facc15"

const CORES = ["#facc15","#86efac","#93c5fd","#f9a8d4","#fca5a5","#d8b4fe","#fb923c","#67e8f9"]
const DIAS  = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"]
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho",
               "Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"]

// ── Chave localStorage ──
function chaveEv() { return "sl_cal_" + (userId || "local") }

// ── Init ──
async function init() {
  const { data } = await _supa.auth.getSession()
  if (!data.session) { location.href = "login.html?next=calendario.html"; return }
  userId = data.session.user.id

  // Carregar localStorage primeiro (rápido)
  try { eventos = JSON.parse(localStorage.getItem(chaveEv()) || "[]") } catch { eventos = [] }
  renderizar()

  // Depois sincronizar com Supabase
  await sincronizarEventos()
  renderizar()
}

// ── Supabase: carregar eventos ──
async function sincronizarEventos() {
  try {
    const { data, error } = await _supa
      .from("eventos_calendario")
      .select("*")
      .eq("user_id", userId)
      .order("inicio", { ascending: true })
    if (error) throw error
    eventos = data.map(e => ({
      id:     e.id,
      titulo: e.titulo,
      desc:   e.descricao || "",
      inicio: new Date(e.inicio),
      fim:    new Date(e.fim),
      cor:    e.cor || "#facc15"
    }))
    localStorage.setItem(chaveEv(), JSON.stringify(eventos.map(e => ({
      ...e, inicio: e.inicio.toISOString(), fim: e.fim.toISOString()
    }))))
  } catch {}
}

async function salvarEventoSupabase(ev) {
  try {
    if (ev.id && typeof ev.id === "number") {
      // Update
      await _supa.from("eventos_calendario").update({
        titulo: ev.titulo, descricao: ev.desc,
        inicio: ev.inicio.toISOString(), fim: ev.fim.toISOString(), cor: ev.cor
      }).eq("id", ev.id).eq("user_id", userId)
    } else {
      // Insert
      const { data } = await _supa.from("eventos_calendario").insert({
        user_id: userId, titulo: ev.titulo, descricao: ev.desc,
        inicio: ev.inicio.toISOString(), fim: ev.fim.toISOString(), cor: ev.cor
      }).select("id").single()
      if (data) ev.id = data.id
    }
    persistirLocal()
  } catch {}
}

async function deletarEventoSupabase(id) {
  try {
    if (typeof id === "number") {
      await _supa.from("eventos_calendario").delete().eq("id", id).eq("user_id", userId)
    }
  } catch {}
}

function persistirLocal() {
  localStorage.setItem(chaveEv(), JSON.stringify(eventos.map(e => ({
    ...e, inicio: e.inicio.toISOString(), fim: e.fim.toISOString()
  }))))
}

// ── Navegação ──
function irHoje() { cursor = new Date(hoje); renderizar() }

function navegar(dir) {
  if (vista === "dia") {
    cursor.setDate(cursor.getDate() + dir)
  } else if (vista === "semana") {
    cursor.setDate(cursor.getDate() + dir * 7)
  } else if (vista === "mes") {
    cursor.setMonth(cursor.getMonth() + dir)
  } else if (vista === "ano") {
    cursor.setFullYear(cursor.getFullYear() + dir)
  }
  renderizar()
}

function setVista(v) {
  vista = v
  document.querySelectorAll(".nav-btn[id^='vm-']").forEach(b => b.classList.remove("ativo"))
  document.getElementById("vm-" + v).classList.add("ativo")
  renderizar()
}

// ── Renderizar ──
function renderizar() {
  const body = document.getElementById("cal-body")
  body.innerHTML = ""

  if (vista === "mes")    renderMes(body)
  else if (vista === "semana") renderSemana(body)
  else if (vista === "dia")    renderDia(body)
  else if (vista === "ano")    renderAno(body)
}

// ─── VISTA MÊS ───────────────────────────────────────────
function renderMes(body) {
  const ano = cursor.getFullYear(), mes = cursor.getMonth()
  document.getElementById("periodo-label").textContent = `${MESES[mes]} ${ano}`

  // Header dias
  const header = document.createElement("div")
  header.className = "dias-header"
  header.style.gridTemplateColumns = "repeat(7,1fr)"
  DIAS.forEach(d => {
    const el = document.createElement("div")
    el.className = "dia-header"; el.textContent = d
    header.appendChild(el)
  })
  body.appendChild(header)

  const gradeWrap = document.createElement("div")
  gradeWrap.className = "grade-wrap"
  body.appendChild(gradeWrap)

  const grade = document.createElement("div")
  grade.className = "grade"

  // Calcular células
  const primeiro = new Date(ano, mes, 1)
  const ultimo   = new Date(ano, mes + 1, 0)
  const inicio   = new Date(primeiro)
  inicio.setDate(1 - primeiro.getDay())

  const rows = Math.ceil((primeiro.getDay() + ultimo.getDate()) / 7)
  grade.style.gridTemplateColumns = "repeat(7,1fr)"
  grade.style.gridTemplateRows    = `repeat(${rows},1fr)`
  grade.style.height = "100%"
  gradeWrap.style.height = "100%"

  const cur = new Date(inicio)
  for (let i = 0; i < rows * 7; i++) {
    const d = new Date(cur)
    const cel = document.createElement("div")
    cel.className = "celula"
    if (d.getMonth() !== mes) cel.classList.add("outro-mes")
    if (mesmoDia(d, hoje)) cel.classList.add("hoje-cel")

    const num = document.createElement("span")
    num.className = "num-dia"
    if (mesmoDia(d, hoje)) num.classList.add("hoje-num")
    num.textContent = d.getDate()
    cel.appendChild(num)

    // Eventos do dia
    const evsDia = eventosNoDia(d)
    const MAX_SHOW = 3
    evsDia.slice(0, MAX_SHOW).forEach(ev => {
      const pill = document.createElement("span")
      pill.className = "ev-pill"
      pill.style.background = ev.cor
      pill.textContent = (ev.inicio.getHours() ? horaStr(ev.inicio) + " " : "") + ev.titulo
      pill.onclick = (e) => { e.stopPropagation(); abrirModal(ev) }
      cel.appendChild(pill)
    })
    if (evsDia.length > MAX_SHOW) {
      const mais = document.createElement("span")
      mais.className = "ev-mais"
      mais.textContent = `+${evsDia.length - MAX_SHOW} mais`
      mais.onclick = (e) => { e.stopPropagation(); cursor = d; setVista("dia") }
      cel.appendChild(mais)
    }

    const dataStr = isoData(d)
    cel.addEventListener("click", () => abrirModal(null, dataStr))
    gradeWrap.appendChild(cel)
    cur.setDate(cur.getDate() + 1)
  }
  gradeWrap.appendChild(grade)
  // mover células para grade
  while (gradeWrap.firstChild !== grade) grade.appendChild(gradeWrap.firstChild)
}

// ─── VISTA SEMANA ────────────────────────────────────────
function renderSemana(body) {
  const seg = new Date(cursor)
  seg.setDate(cursor.getDate() - cursor.getDay())
  const fim = new Date(seg); fim.setDate(seg.getDate() + 6)

  document.getElementById("periodo-label").textContent =
    `${seg.getDate()} ${MESES[seg.getMonth()].slice(0,3)} – ${fim.getDate()} ${MESES[fim.getMonth()].slice(0,3)} ${fim.getFullYear()}`

  renderTimeline(body, seg, 7)
}

// ─── VISTA DIA ───────────────────────────────────────────
function renderDia(body) {
  document.getElementById("periodo-label").textContent =
    `${DIAS[cursor.getDay()]}, ${cursor.getDate()} de ${MESES[cursor.getMonth()]} de ${cursor.getFullYear()}`
  renderTimeline(body, cursor, 1)
}

function renderTimeline(body, diaInicio, numDias) {
  // Header
  const header = document.createElement("div")
  header.className = "dias-header"
  header.style.gridTemplateColumns = `52px repeat(${numDias},1fr)`
  const vazio = document.createElement("div"); vazio.style.borderRight = "1px solid var(--border)"
  header.appendChild(vazio)
  for (let i = 0; i < numDias; i++) {
    const d = new Date(diaInicio); d.setDate(d.getDate() + i)
    const el = document.createElement("div")
    el.className = "dia-header" + (mesmoDia(d, hoje) ? " hoje" : "")
    el.innerHTML = `<div>${DIAS[d.getDay()]}</div><div style="font-size:18px;font-weight:bold;color:${mesmoDia(d,hoje)?"var(--accent)":"var(--text)"}">${d.getDate()}</div>`
    header.appendChild(el)
  }
  body.appendChild(header)

  const tl = document.createElement("div")
  tl.className = "timeline"
  body.appendChild(tl)

  // Coluna de horas
  const horasCol = document.createElement("div")
  horasCol.className = "horas-col"
  for (let h = 0; h < 24; h++) {
    const el = document.createElement("div")
    el.className = "hora-label"
    el.textContent = h === 0 ? "" : `${String(h).padStart(2,"0")}:00`
    horasCol.appendChild(el)
  }
  tl.appendChild(horasCol)

  const diasCols = document.createElement("div")
  diasCols.className = "dias-cols"
  tl.appendChild(diasCols)

  for (let i = 0; i < numDias; i++) {
    const d = new Date(diaInicio); d.setDate(d.getDate() + i)
    const col = document.createElement("div")
    col.className = "dia-col"

    // Slots de hora
    for (let h = 0; h < 24; h++) {
      const slot = document.createElement("div")
      slot.className = "hora-slot"
      const dataStr = isoData(d)
      const horaStr2 = `${String(h).padStart(2,"0")}:00`
      slot.onclick = () => abrirModal(null, dataStr, horaStr2)
      col.appendChild(slot)
    }

    // Linha de hora atual
    if (mesmoDia(d, hoje)) {
      const agora = new Date()
      const pct = (agora.getHours() * 60 + agora.getMinutes()) / (24 * 60) * 100
      const linha = document.createElement("div")
      linha.className = "hora-atual-linha"
      linha.style.top = pct + "%"
      col.appendChild(linha)
    }

    // Eventos do dia
    const evsDia = eventosNoDia(d)
    evsDia.forEach(ev => {
      const ini = ev.inicio, fim = ev.fim
      const topPct  = (ini.getHours() * 60 + ini.getMinutes()) / (24*60) * 100
      const durMin  = Math.max((fim - ini) / 60000, 30)
      const heightPct = durMin / (24*60) * 100

      const bloco = document.createElement("div")
      bloco.className = "ev-bloco"
      bloco.style.cssText = `top:${topPct}%;height:${heightPct}%;background:${ev.cor};`
      bloco.innerHTML = `<div style="font-size:11px">${horaStr(ini)}</div><div>${ev.titulo}</div>`
      bloco.onclick = (e) => { e.stopPropagation(); abrirModal(ev) }
      col.appendChild(bloco)
    })

    diasCols.appendChild(col)
  }

  // Scroll para hora atual
  requestAnimationFrame(() => {
    const agora = new Date()
    const scrollTop = (agora.getHours() * 60 + agora.getMinutes()) / (24*60) * (24 * 60) - 100
    tl.scrollTop = Math.max(0, scrollTop)
  })
}

// ─── VISTA ANO ───────────────────────────────────────────
function renderAno(body) {
  const ano = cursor.getFullYear()
  document.getElementById("periodo-label").textContent = String(ano)

  const grid = document.createElement("div")
  grid.className = "ano-grid"
  body.appendChild(grid)

  for (let m = 0; m < 12; m++) {
    const mm = document.createElement("div")
    mm.className = "mini-mes"

    const titulo = document.createElement("div")
    titulo.className = "mini-mes-titulo"
    titulo.textContent = MESES[m]
    mm.appendChild(titulo)

    const grade = document.createElement("div")
    grade.className = "mini-grade"

    DIAS.forEach(d => {
      const h = document.createElement("div")
      h.className = "mini-dia-header"; h.textContent = d[0]
      grade.appendChild(h)
    })

    const primeiro = new Date(ano, m, 1)
    const ultimo   = new Date(ano, m + 1, 0)
    const inicio   = new Date(primeiro)
    inicio.setDate(1 - primeiro.getDay())

    const rows = Math.ceil((primeiro.getDay() + ultimo.getDate()) / 7)
    const cur  = new Date(inicio)

    for (let i = 0; i < rows * 7; i++) {
      const d = new Date(cur)
      const cel = document.createElement("div")
      cel.className = "mini-cel"
      if (d.getMonth() !== m) cel.classList.add("outro")
      else if (mesmoDia(d, hoje)) cel.classList.add("hoje-m")
      else if (eventosNoDia(d).length) cel.classList.add("tem-ev")
      cel.textContent = d.getDate()
      cel.title = eventosNoDia(d).map(e => e.titulo).join(", ") || ""
      cel.onclick = () => { cursor = new Date(d); setVista("dia") }
      grade.appendChild(cel)
      cur.setDate(cur.getDate() + 1)
    }

    mm.appendChild(grade)
    grid.appendChild(mm)
  }
}

// ─── MODAL ───────────────────────────────────────────────
function abrirModal(ev, dataStr, horaIni) {
  evEditing = ev ? ev.id : null

  document.getElementById("modal-titulo").textContent = ev ? "Editar Evento" : "Novo Evento"
  document.getElementById("btn-del-ev").style.display = ev ? "block" : "none"

  // Preencher campos
  const agora = new Date()
  document.getElementById("ev-nome").value     = ev ? ev.titulo : ""
  document.getElementById("ev-desc").value     = ev ? ev.desc   : ""
  document.getElementById("ev-data").value     = ev ? isoData(ev.inicio) : (dataStr || isoData(agora))
  document.getElementById("ev-hora-ini").value = ev ? horaStr(ev.inicio) : (horaIni || "09:00")
  document.getElementById("ev-data-fim").value = ev ? isoData(ev.fim)    : (dataStr || isoData(agora))
  document.getElementById("ev-hora-fim").value = ev ? horaStr(ev.fim)    : horaFim(horaIni || "09:00")

  corAtual = ev ? ev.cor : "#facc15"
  renderCoresModal()

  document.getElementById("modal").classList.add("aberto")
  setTimeout(() => document.getElementById("ev-nome").focus(), 50)
}

function renderCoresModal() {
  const wrap = document.getElementById("cores-ev")
  wrap.innerHTML = ""
  CORES.forEach(cor => {
    const el = document.createElement("div")
    el.className = "cor-ev" + (cor === corAtual ? " sel" : "")
    el.style.background = cor
    el.onclick = () => { corAtual = cor; renderCoresModal() }
    wrap.appendChild(el)
  })
}

function fecharModal() { document.getElementById("modal").classList.remove("aberto") }
function fecharModalOverlay(e) { if (e.target === document.getElementById("modal")) fecharModal() }

async function salvarEvento() {
  const titulo = document.getElementById("ev-nome").value.trim()
  if (!titulo) { document.getElementById("ev-nome").focus(); return }

  const dataIni  = document.getElementById("ev-data").value
  const horaIni  = document.getElementById("ev-hora-ini").value
  const dataFim  = document.getElementById("ev-data-fim").value
  const horaFimV = document.getElementById("ev-hora-fim").value
  const desc     = document.getElementById("ev-desc").value.trim()

  const inicio = new Date(`${dataIni}T${horaIni}`)
  const fim    = new Date(`${dataFim}T${horaFimV}`)

  if (fim <= inicio) { alert("A hora de fim deve ser após o início."); return }

  if (evEditing !== null) {
    // Editar
    const ev = eventos.find(e => e.id === evEditing)
    if (ev) { ev.titulo = titulo; ev.desc = desc; ev.inicio = inicio; ev.fim = fim; ev.cor = corAtual }
    await salvarEventoSupabase(ev)
  } else {
    // Novo
    const novoEv = { id: "tmp_" + Date.now(), titulo, desc, inicio, fim, cor: corAtual }
    eventos.push(novoEv)
    await salvarEventoSupabase(novoEv)
  }

  fecharModal()
  renderizar()
}

async function deletarEvento() {
  if (evEditing === null) return
  if (!confirm("Excluir este evento?")) return
  await deletarEventoSupabase(evEditing)
  eventos = eventos.filter(e => e.id !== evEditing)
  persistirLocal()
  fecharModal()
  renderizar()
}

// ─── HELPERS ─────────────────────────────────────────────
function mesmoDia(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth()    === b.getMonth()    &&
         a.getDate()     === b.getDate()
}

function eventosNoDia(d) {
  return eventos.filter(ev => {
    const ini = ev.inicio instanceof Date ? ev.inicio : new Date(ev.inicio)
    const fim = ev.fim    instanceof Date ? ev.fim    : new Date(ev.fim)
    const dIni = new Date(d); dIni.setHours(0,0,0,0)
    const dFim = new Date(d); dFim.setHours(23,59,59,999)
    return ini <= dFim && fim >= dIni
  })
}

function isoData(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`
}

function horaStr(d) {
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`
}

function horaFim(horaIni) {
  const [h, m] = horaIni.split(":").map(Number)
  const fim = h + 1
  return `${String(fim > 23 ? 23 : fim).padStart(2,"0")}:${String(m).padStart(2,"0")}`
}

// Fechar modal com Escape
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharModal() })

// ── Start ──
init()
</script>
