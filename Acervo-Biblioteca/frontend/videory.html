<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="IconeSH.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videory — Omnisentis</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f0f;
      --surface: #1a1a1a;
      --surface2:#222;
      --border:  #2a2a2a;
      --text:    #eee;
      --muted:   #aaa;
      --accent:  #ffd700;
      --radius:  10px;
    }

    body { background: var(--bg); color: var(--text); font-family: Arial, sans-serif; min-height: 100vh; }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 16px;
      padding: 10px 24px;
      background: rgba(15,15,15,0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .header-logo { font-size: 16px; font-weight: bold; color: var(--accent); white-space: nowrap; text-decoration: none; }
    .header-logo span { color: #eee; }
    .header-busca {
      flex: 1; max-width: 600px; display: flex; gap: 0;
    }
    .header-busca input {
      flex: 1; padding: 8px 16px; border-radius: 20px 0 0 20px;
      border: 1px solid var(--border); border-right: none;
      background: var(--surface2); color: var(--text); font-size: 14px;
    }
    .header-busca input:focus { outline: none; border-color: #555; }
    .header-busca button {
      padding: 8px 16px; border-radius: 0 20px 20px 0;
      border: 1px solid var(--border); border-left: none;
      background: var(--surface); color: var(--text); cursor: pointer; font-size: 14px;
    }
    .header-busca button:hover { background: #333; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    /* ── Abas ── */
    .abas {
      display: flex; gap: 4px; padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto; background: var(--bg);
    }
    .aba-btn {
      padding: 7px 16px; border-radius: 20px; border: none;
      background: var(--surface2); color: var(--muted);
      font-size: 13px; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .aba-btn:hover { background: #333; color: var(--text); }
    .aba-btn.ativo { background: var(--text); color: #111; font-weight: bold; }

    /* ── Layout principal ── */
    .layout { display: flex; gap: 0; }

    /* ── Sidebar playlists ── */
    .sidebar {
      width: 260px; flex-shrink: 0;
      padding: 16px 12px;
      border-right: 1px solid var(--border);
      min-height: calc(100vh - 120px);
    }
    .sidebar-titulo {
      font-size: 13px; font-weight: bold; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 12px; padding: 0 4px;
    }
    .btn-nova-playlist {
      width: 100%; padding: 9px; border-radius: var(--radius);
      border: 1px dashed var(--border); background: transparent;
      color: var(--accent); font-size: 13px; cursor: pointer;
      margin-bottom: 12px; transition: background 0.15s;
    }
    .btn-nova-playlist:hover { background: rgba(255,215,0,0.05); }
    .playlist-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: var(--radius);
      cursor: pointer; transition: background 0.1s;
      position: relative;
    }
    .playlist-item:hover { background: var(--surface); }
    .playlist-item.ativa { background: var(--surface2); }
    .playlist-icon { font-size: 18px; flex-shrink: 0; }
    .playlist-nome { font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .playlist-count { font-size: 11px; color: var(--muted); }
    .playlist-acoes {
      display: none; gap: 4px; position: absolute; right: 8px;
    }
    .playlist-item:hover .playlist-acoes { display: flex; }
    .pl-btn {
      background: none; border: none; color: var(--muted);
      font-size: 12px; cursor: pointer; padding: 2px 4px;
      border-radius: 4px;
    }
    .pl-btn:hover { color: var(--text); background: var(--border); }

    /* ── Grid de vídeos ── */
    .conteudo { flex: 1; padding: 20px 24px; }
    .secao-titulo {
      font-size: 16px; font-weight: bold; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .btn-voltar-todos {
      display: none; align-items: center; gap: 6px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 6px 14px;
      font-size: 13px; cursor: pointer; margin-bottom: 16px;
      transition: background 0.15s;
    }
    .btn-voltar-todos:hover { background: #333; }
    .btn-voltar-todos.visivel { display: inline-flex; }
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px; margin-bottom: 32px;
    }
    .video-card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .video-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .video-thumb-wrap {
      position: relative; aspect-ratio: 16/9;
      background: #111; overflow: hidden;
    }
    .video-thumb {
      width: 100%; height: 100%; object-fit: cover;
      transition: opacity 0.2s;
    }
    .video-thumb-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; background: linear-gradient(135deg, #1a1a1a, #333);
    }
    .video-play-icon {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s;
      background: rgba(0,0,0,0.3);
    }
    .video-play-icon span { font-size: 48px; }
    .video-card:hover .video-play-icon { opacity: 1; }
    .video-tag-link {
      position: absolute; top: 8px; right: 8px;
      background: rgba(255,215,0,0.85); color: #111;
      font-size: 10px; font-weight: bold; border-radius: 4px;
      padding: 2px 6px;
    }
    .video-info { padding: 12px; }
    .video-titulo { font-size: 14px; font-weight: bold; margin-bottom: 4px; line-height: 1.3; }
    .video-autor  { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .video-desc   { font-size: 12px; color: #888; margin-bottom: 8px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .video-tags   { display: flex; flex-wrap: wrap; gap: 4px; }
    .video-tag {
      font-size: 11px; background: var(--surface2);
      color: var(--muted); border-radius: 12px;
      padding: 2px 8px; cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .video-tag:hover { background: #333; color: var(--text); }

    /* ── Modal player ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); z-index: 200;
      align-items: flex-start; justify-content: center;
      overflow-y: auto; padding: 20px;
    }
    .modal-overlay.aberto { display: flex; }
    .modal-player {
      background: var(--surface); border-radius: 14px;
      width: 100%; max-width: 900px;
      box-shadow: 0 16px 64px rgba(0,0,0,0.8);
      overflow: hidden; margin: auto;
    }
    .modal-video-wrap {
      position: relative; aspect-ratio: 16/9;
      background: #000;
    }
    .modal-video-wrap video,
    .modal-video-wrap iframe {
      width: 100%; height: 100%; border: none;
    }
    .modal-fechar {
      position: absolute; top: 12px; right: 12px; z-index: 10;
      background: rgba(0,0,0,0.6); border: none; color: white;
      font-size: 20px; cursor: pointer; border-radius: 50%;
      width: 36px; height: 36px; display: flex;
      align-items: center; justify-content: center;
    }
    .modal-fechar:hover { background: rgba(255,255,255,0.2); }
    .modal-info { padding: 20px 24px; }
    .modal-titulo { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
    .modal-autor  { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
    .modal-desc   { font-size: 14px; color: #bbb; line-height: 1.6; margin-bottom: 16px; white-space: pre-wrap; }
    .modal-tags   { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .modal-tag {
      font-size: 12px; background: var(--surface2);
      color: var(--muted); border-radius: 12px;
      padding: 3px 10px; cursor: pointer;
    }
    .modal-tag:hover { color: var(--text); }
    .modal-relacionados { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; }
    .modal-rel-titulo { font-size: 13px; font-weight: bold; color: var(--muted); margin-bottom: 10px; }
    .modal-rel-link {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface2); border-radius: 8px;
      padding: 6px 12px; color: var(--accent); text-decoration: none;
      font-size: 13px; margin: 0 6px 6px 0; transition: background 0.1s;
    }
    .modal-rel-link:hover { background: #333; }

    /* Botão adicionar à playlist */
    .btn-add-playlist {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 7px 14px;
      font-size: 13px; cursor: pointer; display: inline-flex;
      align-items: center; gap: 6px; transition: background 0.1s;
    }
    .btn-add-playlist:hover { background: #333; }

    /* ── Modal playlists ── */
    .modal-pl {
      background: var(--surface); border-radius: 14px;
      padding: 24px; width: 90%; max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
    }
    .modal-pl h3 { margin: 0 0 16px; font-size: 16px; }
    .modal-pl input, .modal-pl textarea, .modal-pl select {
      width: 100%; padding: 9px 12px; margin-bottom: 10px;
      background: var(--surface2); color: var(--text);
      border: 1px solid #444; border-radius: 8px; font-size: 14px;
    }
    .modal-pl input:focus, .modal-pl textarea:focus { outline: none; border-color: var(--accent); }
    .modal-pl-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
    .btn-prim { background: var(--accent); color: #111; border: none; border-radius: 8px; padding: 8px 18px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-prim:hover { background: #ffe44d; }
    .btn-sec  { background: var(--surface2); color: var(--muted); border: none; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
    .btn-sec:hover { background: #333; }
    .pl-video-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .pl-video-item input[type=checkbox] { width: auto; margin: 0; }

/* ── Modal playlist — grid de seleção ── */
    .pl-grid-sel {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px; max-height: 320px; overflow-y: auto;
      padding: 4px; user-select: none;
      position: relative;
    }
    .pl-grid-item {
      position: relative; border-radius: 8px; overflow: hidden;
      cursor: pointer; border: 2px solid transparent;
      transition: border-color 0.15s, transform 0.1s;
      background: var(--surface2);
    }
    .pl-grid-item:hover { border-color: #555; }
    .pl-grid-item.selecionado { border-color: var(--accent); }
    .pl-grid-item.selecionado::after {
      content: "✓"; position: absolute; top: 4px; right: 6px;
      background: var(--accent); color: #111; font-size: 11px;
      font-weight: bold; border-radius: 50%; width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .pl-grid-thumb {
      width: 100%; aspect-ratio: 16/9; object-fit: cover;
      display: block; background: #222;
    }
    .pl-grid-thumb-placeholder {
      width: 100%; aspect-ratio: 16/9;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; background: #222;
    }
    .pl-grid-titulo {
      font-size: 11px; padding: 4px 6px;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      color: var(--text);
    }
    .pl-sel-info {
      font-size: 12px; color: var(--muted); margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .pl-sel-todos {
      font-size: 12px; color: var(--accent); cursor: pointer; background: none;
      border: none; padding: 0;
    }
    .pl-sel-todos:hover { text-decoration: underline; }

    /* Rubber-band selection overlay */
    .sel-rubber {
      position: fixed; border: 2px solid var(--accent);
      background: rgba(255,215,0,0.08); pointer-events: none;
      z-index: 9999; display: none;
    }
    /* ── Mini-player flutuante ── */
    .mini-player {
      display: none;
      position: fixed; bottom: 20px; right: 20px;
      width: 300px; z-index: 300;
      background: var(--surface); border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      overflow: hidden; cursor: move;
      border: 1px solid var(--border);
      transition: box-shadow 0.15s;
      user-select: none;
    }
    .mini-player.visivel { display: block; }
    .mini-player:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.9); }
    .mini-player-video {
      position: relative; aspect-ratio: 16/9; background: #000;
      pointer-events: none; /* permite arrastar sem interferir no vídeo */
    }
    .mini-player-video.interativo { pointer-events: auto; }
    .mini-player-video video,
    .mini-player-video iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
    .mini-player-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 10px; background: var(--surface2);
      pointer-events: auto;
    }
    .mini-titulo {
      flex: 1; font-size: 11px; font-weight: bold;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      color: var(--text); pointer-events: none;
    }
    .mini-btn {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 15px; padding: 2px 5px;
      border-radius: 4px; transition: color 0.1s, background 0.1s;
      line-height: 1;
    }
    .mini-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
    .mini-resize-handle {
      position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
      cursor: ns-resize; z-index: 5;
    }

    @media (max-width: 480px) {
      .mini-player { width: 240px; bottom: 12px; right: 12px; }
    }
    .btn-add-fila {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.75); color: #fff;
      border: none; border-radius: 6px;
      padding: 4px 8px; font-size: 11px;
      cursor: pointer; opacity: 0;
      transition: opacity 0.2s, background 0.15s;
      display: flex; align-items: center; gap: 4px;
      z-index: 5; white-space: nowrap;
    }
    .video-card:hover .btn-add-fila { opacity: 1; }
    .btn-add-fila:hover { background: var(--accent); color: #111; }
    .btn-add-fila.na-fila { background: var(--accent); color: #111; opacity: 1; }

    /* ── Layout do player com painel lateral ── */
    .modal-player-layout {
      display: flex; flex-direction: row;
      width: 100%; max-width: 1200px;
      background: var(--surface); border-radius: 14px;
      overflow: hidden; margin: auto;
      box-shadow: 0 16px 64px rgba(0,0,0,0.8);
      max-height: 90vh;
    }
    .modal-player-main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }

    /* ── Painel da fila ── */
    .fila-painel {
      width: 300px; flex-shrink: 0;
      background: var(--surface2); border-left: 1px solid var(--border);
      display: flex; flex-direction: column; transition: width 0.25s;
    }
    .fila-painel.fechado { width: 0; overflow: hidden; border: none; }
    .fila-header {
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      font-size: 13px; font-weight: bold;
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .fila-count { font-size: 11px; color: var(--muted); font-weight: normal; }
    .fila-lista { flex: 1; overflow-y: auto; }
    .fila-item {
      display: flex; gap: 8px; align-items: center;
      padding: 8px 10px; cursor: pointer;
      transition: background 0.1s; border-bottom: 1px solid var(--border);
      position: relative;
    }
    .fila-item:hover { background: rgba(255,255,255,0.04); }
    .fila-item.tocando { background: rgba(255,215,0,0.08); border-left: 3px solid var(--accent); }
    .fila-thumb {
      width: 68px; height: 42px; object-fit: cover;
      border-radius: 4px; flex-shrink: 0; background: #111;
    }
    .fila-thumb-ph {
      width: 68px; height: 42px; border-radius: 4px;
      background: #222; display: flex; align-items: center;
      justify-content: center; font-size: 16px; flex-shrink: 0;
    }
    .fila-info { flex: 1; min-width: 0; }
    .fila-titulo { font-size: 12px; font-weight: bold; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .fila-autor  { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .fila-remover {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 14px; opacity: 0; flex-shrink: 0; padding: 2px 4px;
    }
    .fila-item:hover .fila-remover { opacity: 1; }
    .fila-remover:hover { color: #f88; }
    .fila-vazia { padding: 24px 12px; text-align: center; font-size: 12px; color: var(--muted); }
    .fila-acoes {
      padding: 8px 10px; border-top: 1px solid var(--border);
      display: flex; gap: 6px; flex-shrink: 0;
    }
    .btn-fila-acao {
      flex: 1; padding: 6px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-size: 11px; cursor: pointer; transition: background 0.1s;
    }
    .btn-fila-acao:hover { background: #333; }
    .btn-fila-acao.ativo { background: var(--accent); color: #111; border-color: var(--accent); }

    /* ── Controles do player ── */
    .player-controles {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; background: var(--surface2);
      border-top: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
    }
    .btn-player {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 5px 10px;
      font-size: 12px; cursor: pointer; transition: background 0.1s;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-player:hover { background: #333; }
    .btn-player.ativo { background: var(--accent); color: #111; border-color: var(--accent); }
    .player-titulo-atual {
      flex: 1; font-size: 11px; color: var(--muted);
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }

    @media (max-width: 768px) {
      .modal-player-layout { flex-direction: column; max-height: none; border-radius: 0; }
      .fila-painel { width: 100% !important; border-left: none; border-top: 1px solid var(--border); max-height: 260px; }
      .fila-painel.fechado { max-height: 0; overflow: hidden; border: none; }
    }

    /* ── Vazio ── */
    .vazio span { font-size: 48px; display: block; margin-bottom: 12px; }

    /* ── Responsivo ── */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .videos-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .header { padding: 10px 12px; }
      .conteudo { padding: 12px; }
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <a class="header-logo" href="index.html">⚔ Omni<span>sentis</span></a>
  <div class="header-busca">
    <input id="busca-input" placeholder="Pesquisar vídeos..." oninput="filtrar()">
    <button onclick="filtrar()">🔍</button>
  </div>
  <div class="header-right" id="btn-conta-wrap"></div>
</div>

<!-- Abas -->
<div class="abas">
  <button class="aba-btn ativo" onclick="setAba('todos', this)">🎬 Todos</button>
  <button class="aba-btn" onclick="setAba('minhas-playlists', this)">📋 Minhas playlists</button>
  <button class="aba-btn" onclick="setAba('playlists-publicas', this)">🌐 Playlists públicas</button>
</div>

<!-- Layout -->
<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-titulo">📋 Minhas playlists</div>
    <button class="btn-nova-playlist" onclick="abrirModalNovaPlaylist()">+ Nova playlist</button>
    <div id="lista-playlists-sidebar"></div>
  </div>

  <!-- Conteúdo -->
  <div class="conteudo" id="conteudo">
    <div id="secao-todos">
      <button class="btn-voltar-todos" id="btn-voltar-todos" onclick="voltarTodos()">← Todos os vídeos</button>
      <div class="secao-titulo" id="titulo-secao-todos">🎬 Todos os vídeos</div>
      <div class="videos-grid" id="grid-videos"></div>
    </div>
    <div id="secao-minhas-playlists" style="display:none">
      <div class="secao-titulo">📋 Minhas playlists</div>
      <div id="grid-minhas-playlists"></div>
    </div>
    <div id="secao-playlists-publicas" style="display:none">
      <div class="secao-titulo">🌐 Playlists públicas</div>
      <div class="videos-grid" id="grid-playlists-publicas"></div>
    </div>
  </div>
</div>

<!-- Mini-player flutuante -->
<div class="mini-player" id="mini-player">

<script>

const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3Z2d3Z2Vwd2Jydm1tcmdzcnZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1Mzc4ODcsImV4cCI6MjA4OTExMzg4N30.BFaHUNavW7VOApg35r01SHsfjgYKUnhlT7YSADF9H6U"
const _supa = supabase.createClient(SUPA_URL, SUPA_KEY)

let videos    = []
let playlists = []
let videoAtual = null
let plEditandoId = null
let logado   = false
let userId   = null
let username = null
let _token   = ""
let abaAtiva = "todos"

// ── Init ──
async function init() {
  const { data } = await _supa.auth.getSession()
  if (data.session) {
    logado   = true
    userId   = data.session.user.id
    username = data.session.user.user_metadata?.username || data.session.user.email.split("@")[0]
    _token   = data.session.access_token
    localStorage.setItem("sl_role",     "user")
    localStorage.setItem("sl_username", username)
  }
  renderConta()
  await carregarVideos()
  if (logado) await carregarPlaylists()
  else renderSidebarSemLogin()
}

function jwtHeader() {
  return _token ? { "Authorization": "Bearer " + _token } : {}
}

// ── Carregar vídeos ──
async function carregarVideos(tentativa = 1) {
  const grid = document.getElementById("grid-videos")
  try {
    if (tentativa === 1) {
      grid.innerHTML = '<div class="vazio"><span>⏳</span>Carregando vídeos...</div>'
      try { await fetch(`${API}/`, { mode: "cors" }) } catch {}
    }
    const res  = await fetch(`${API}/videos`)
    videos     = await res.json()
    renderVideos(videos)
  } catch {
    if (tentativa < 4) {
      grid.innerHTML = `<div class="vazio"><span>😴</span>Servidor acordando... (${tentativa}/3)</div>`
      setTimeout(() => carregarVideos(tentativa + 1), tentativa * 3000)
    } else {
      grid.innerHTML = '<div class="vazio"><span>❌</span>Não foi possível conectar.</div>'
    }
  }
}

// ── Render grid de vídeos ──
function renderVideos(lista) {
  const grid = document.getElementById("grid-videos")
  if (!lista.length) {
    grid.innerHTML = '<div class="vazio"><span>🎬</span>Nenhum vídeo encontrado.</div>'
    return
  }
  grid.innerHTML = ""
  lista.forEach(v => grid.appendChild(criarCardVideo(v)))
}

// ── Extrair thumbnail automática ──
function getThumbnail(v) {
  if (v.capa_url) return { type: "img", src: v.capa_url }
  // YouTube
  if (v.link_externo) {
    const ytMatch = v.link_externo.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/)
    if (ytMatch) return { type: "img", src: `https://img.youtube.com/vi/${ytMatch[1]}/hqdefault.jpg` }
  }
  // Vídeo hospedado — gera thumbnail via canvas
  if (v.video_url) return { type: "video", src: v.video_url }
  return { type: "placeholder" }
}

function criarCardVideo(v) {
  const card = document.createElement("div")
  card.className = "video-card"

  const thumb = getThumbnail(v)
  let thumbHtml
  if (thumb.type === "img") {
    thumbHtml = `<img class="video-thumb" src="${thumb.src}" alt="${v.titulo}" loading="lazy"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    thumbHtml += `<div class="video-thumb-placeholder" style="display:none">🎬</div>`
  } else if (thumb.type === "video") {
    // Captura frame do vídeo via canvas
    thumbHtml = `
      <video class="video-thumb" src="${thumb.src}" preload="metadata" muted
        style="object-fit:cover;width:100%;height:100%;"
        onloadedmetadata="this.currentTime=1"
        onseeked="capturarFrame(this)"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"></video>
      <div class="video-thumb-placeholder" style="display:none">🎬</div>
    `
  } else {
    thumbHtml = `<div class="video-thumb-placeholder">🎬</div>`
  }

  const isExterno = !!v.link_externo
  const tagBadge  = isExterno ? `<span class="video-tag-link">🔗 Link</span>` : ""

  const tagsPills = Array.isArray(v.tags) && v.tags.length
    ? v.tags.map(t => `<span class="video-tag" onclick="event.stopPropagation();filtrarTag('${t}')">#${t}</span>`).join("")
    : ""

  card.innerHTML = `
    <div class="video-thumb-wrap">
      ${thumbHtml}
      <div class="video-play-icon"><span>▶</span></div>
      ${tagBadge}
      <button class="btn-add-fila" id="fila-btn-${v.id}"
        onclick="event.stopPropagation();toggleFila(${v.id})">
        ➕ Fila
      </button>
    </div>
    <div class="video-info">
      <div class="video-titulo">${v.titulo}</div>
      ${v.autor ? `<div class="video-autor">${v.autor}</div>` : ""}
      ${v.descricao ? `<div class="video-desc">${v.descricao}</div>` : ""}
      <div class="video-tags">${tagsPills}</div>
    </div>
  `
  card.onclick = () => abrirPlayer(v)
  return card
}

// ── Estado da fila ──
let fila           = []   // array de objetos video
let filaIndex      = -1   // índice do vídeo tocando na fila
let autoplayAtivo  = true
let repetirAtivo   = false
let filaPanelAberto = false

// ── Fila: adicionar/remover ──
function toggleFila(id) {
  const v = videos.find(vv => vv.id === id)
  if (!v) return
  const idx = fila.findIndex(f => f.id === id)
  if (idx === -1) {
    fila.push(v)
    atualizarBotoesFila()
    renderFilaLista()
    // Se o player estiver aberto, abre o painel
    if (document.getElementById("modal-player").classList.contains("aberto")) {
      abrirFilaPanel()
    }
  } else {
    fila.splice(idx, 1)
    if (filaIndex >= idx) filaIndex = Math.max(-1, filaIndex - 1)
    atualizarBotoesFila()
    renderFilaLista()
  }
}

function atualizarBotoesFila() {
  videos.forEach(v => {
    const btn = document.getElementById(`fila-btn-${v.id}`)
    if (!btn) return
    const naFila = fila.some(f => f.id === v.id)
    btn.classList.toggle("na-fila", naFila)
    btn.textContent = naFila ? "✓ Na fila" : "➕ Fila"
  })
  const count = fila.length
  const countEl = document.getElementById("fila-count")
  if (countEl) countEl.textContent = count ? `(${count})` : ""
}

function renderFilaLista() {
  const lista = document.getElementById("fila-lista")
  if (!lista) return
  if (!fila.length) {
    lista.innerHTML = '<div class="fila-vazia">Fila vazia.<br>Passe o mouse sobre um vídeo<br>e clique em ➕ Fila.</div>'
    return
  }
  lista.innerHTML = ""
  fila.forEach((v, i) => {
    const thumb = getThumbnail(v)
    const thumbHtml = thumb.type === "img"
      ? `<img class="fila-thumb" src="${thumb.src}" onerror="this.style.display='none'">`
      : `<div class="fila-thumb-ph">🎬</div>`

    const item = document.createElement("div")
    item.className = "fila-item" + (i === filaIndex ? " tocando" : "")
    item.innerHTML = `
      ${thumbHtml}
      <div class="fila-info">
        <div class="fila-titulo">${v.titulo}</div>
        ${v.autor ? `<div class="fila-autor">${v.autor}</div>` : ""}
      </div>
      <button class="fila-remover" onclick="event.stopPropagation();removerDaFila(${v.id})" title="Remover">✕</button>
    `
    item.onclick = () => tocarDaFila(i)
    lista.appendChild(item)
  })
  // Scroll para o item tocando
  const tocando = lista.querySelector(".tocando")
  if (tocando) tocando.scrollIntoView({ block: "nearest" })
}

function removerDaFila(id) {
  const idx = fila.findIndex(f => f.id === id)
  if (idx === -1) return
  fila.splice(idx, 1)
  if (filaIndex >= idx) filaIndex = Math.max(-1, filaIndex - 1)
  atualizarBotoesFila()
  renderFilaLista()
}

function limparFila() {
  fila = []; filaIndex = -1
  atualizarBotoesFila()
  renderFilaLista()
}

function embaralharFila() {
  const tocando = filaIndex >= 0 ? fila[filaIndex] : null
  for (let i = fila.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [fila[i], fila[j]] = [fila[j], fila[i]]
  }
  if (tocando) filaIndex = fila.findIndex(f => f.id === tocando.id)
  renderFilaLista()
}

function toggleRepetir() {
  repetirAtivo = !repetirAtivo
  const btn = document.getElementById("btn-repetir")
  if (btn) btn.classList.toggle("ativo", repetirAtivo)
}

function toggleAutoplay() {
  autoplayAtivo = !autoplayAtivo
  const btn = document.getElementById("btn-autoplay")
  if (btn) btn.classList.toggle("ativo", autoplayAtivo)
}

// ── Painel da fila ──
function toggleFilaPanel() {
  filaPanelAberto = !filaPanelAberto
  const painel = document.getElementById("fila-painel")
  painel.classList.toggle("fechado", !filaPanelAberto)
  renderFilaLista()
}

function abrirFilaPanel() {
  filaPanelAberto = true
  const painel = document.getElementById("fila-painel")
  if (painel) { painel.classList.remove("fechado"); renderFilaLista() }
}

// ── Tocar da fila ──
function tocarDaFila(idx) {
  if (idx < 0 || idx >= fila.length) return
  filaIndex = idx
  abrirPlayer(fila[idx])
}

function tocarProximo() {
  if (!fila.length) return
  if (repetirAtivo && filaIndex >= 0) { tocarDaFila(filaIndex); return }
  const proximo = filaIndex + 1
  if (proximo < fila.length) tocarDaFila(proximo)
  else if (repetirAtivo) tocarDaFila(0)
}

function tocarAnterior() {
  if (!fila.length) return
  const anterior = filaIndex - 1
  if (anterior >= 0) tocarDaFila(anterior)
}

// ── Player ──
function abrirPlayer(v) {
  videoAtual = v

  // Atualizar filaIndex se o vídeo está na fila
  const idxNaFila = fila.findIndex(f => f.id === v.id)
  if (idxNaFila !== -1) filaIndex = idxNaFila

  document.getElementById("modal-titulo").textContent = v.titulo
  document.getElementById("modal-autor").textContent  = v.autor || ""
  document.getElementById("modal-desc").textContent   = v.descricao || ""
  document.getElementById("player-titulo-atual").textContent = v.titulo

  // Tags
  const tagsEl = document.getElementById("modal-tags")
  tagsEl.innerHTML = Array.isArray(v.tags) && v.tags.length
    ? v.tags.map(t => `<span class="modal-tag" onclick="filtrarTag('${t}');fecharPlayer()">#${t}</span>`).join("")
    : ""

  document.getElementById("btn-add-pl").style.display = logado ? "inline-flex" : "none"

  // Atualizar estado dos botões de controle
  const btnAutoplay = document.getElementById("btn-autoplay")
  if (btnAutoplay) btnAutoplay.classList.toggle("ativo", autoplayAtivo)
  const btnRepetir = document.getElementById("btn-repetir")
  if (btnRepetir) btnRepetir.classList.toggle("ativo", repetirAtivo)

  // Montar player
  montarPlayer(v)

  // Relacionados
  const relWrap  = document.getElementById("modal-relacionados")
  const relLinks = document.getElementById("modal-rel-links")
  relLinks.innerHTML = ""
  relWrap.style.display = "none"
  if (v.links_relacionados) {
    const ids = v.links_relacionados.split(",").map(Number).filter(n => !isNaN(n) && n > 0)
    if (ids.length) {
      fetch(`${API}/livros`).then(r => r.json()).then(todosLivros => {
        const livrosRel = todosLivros.filter(l => ids.includes(l.id))
        if (!livrosRel.length) return
        relLinks.innerHTML = livrosRel.map(l => {
          const isPDF = l.arquivo_url && l.arquivo_url.toLowerCase().endsWith(".pdf")
          const href  = isPDF ? `leitor.html?pdf=${encodeURIComponent(l.arquivo_url)}` : l.arquivo_url
          const capaHtml = l.capa_url
            ? `<img src="${l.capa_url}" style="width:36px;height:50px;object-fit:cover;border-radius:4px;flex-shrink:0;">`
            : `<span style="font-size:24px;">📄</span>`
          return `<a class="modal-rel-link" href="${href}" target="_blank" style="align-items:center;">
            ${capaHtml}
            <div>
              <div style="font-weight:bold;font-size:13px;">${l.titulo}</div>
              ${l.autor ? `<div style="font-size:11px;color:#aaa;">${l.autor}</div>` : ""}
            </div>
          </a>`
        }).join("")
        relWrap.style.display = "block"
      }).catch(() => {})
    }
  }

  // Renderizar fila
  renderFilaLista()
  atualizarBotoesFila()

  // Abrir modal
  document.getElementById("modal-player").classList.add("aberto")
  document.body.style.overflow = "hidden"

  // Media Session API (controles de SO/fone)
  atualizarMediaSession(v)
}

function montarPlayer(v) {
  const wrap = document.getElementById("modal-video-wrap")
  const oldPlayer = wrap.querySelector("video, iframe, a")
  if (oldPlayer) oldPlayer.remove()

  if (v.link_externo) {
    const ytMatch = v.link_externo.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/)
    if (ytMatch) {
      const iframe = document.createElement("iframe")
      iframe.src = `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&enablejsapi=1`
      iframe.allow = "autoplay; fullscreen; picture-in-picture"
      iframe.allowFullscreen = true
      iframe.id = "player-iframe"
      wrap.appendChild(iframe)
      // YouTube não dispara ended diretamente — usar postMessage
      window._ytPlayerReady = false
    } else {
      const a = document.createElement("a")
      a.href = v.link_externo; a.target = "_blank"
      a.style.cssText = "display:flex;align-items:center;justify-content:center;height:100%;color:#ffd700;font-size:16px;text-decoration:none;"
      a.textContent = "▶ Abrir vídeo externo"
      wrap.appendChild(a)
    }
  } else if (v.video_url) {
    const video = document.createElement("video")
    video.src         = v.video_url
    video.controls    = true
    video.autoplay    = true
    video.id          = "player-video"
    video.setAttribute("playsinline", "")        // iOS: não forçar fullscreen
    video.setAttribute("webkit-playsinline", "") // iOS Safari legado
    video.addEventListener("ended", () => {
      if (autoplayAtivo) tocarProximo()
    })
    wrap.appendChild(video)
  }

  // Ocultar botão PiP se não for vídeo local
  const btnPip = document.getElementById("btn-pip")
  if (btnPip) btnPip.style.display = v.video_url ? "flex" : "none"
}

// ── Mini-player: minimizar ──
let miniMudo = false
let wakeLock  = null

function minimizarPlayer() {
  const wrap     = document.getElementById("modal-video-wrap")
  const miniWrap = document.getElementById("mini-video-wrap")
  const v        = videoAtual
  if (!v) return

  // Mover o elemento de mídia (video/iframe) para o mini-player
  const mediaEl = wrap.querySelector("video, iframe")
  if (mediaEl) {
    // Clonar se for iframe (YT não pode ser movido sem reload)
    if (mediaEl.tagName === "IFRAME") {
      const iframe = document.createElement("iframe")
      iframe.src = mediaEl.src
      iframe.allow = mediaEl.allow
      iframe.allowFullscreen = true
      iframe.style.cssText = "width:100%;height:100%;border:none;display:block;"
      miniWrap.appendChild(iframe)
      mediaEl.remove()
    } else {
      // Vídeo HTML5: mover diretamente mantendo o estado de reprodução
      mediaEl.style.cssText = "width:100%;height:100%;display:block;"
      miniWrap.appendChild(mediaEl)
    }
  }

  document.getElementById("mini-titulo").textContent = v.titulo || "—"
  document.getElementById("mini-player").classList.add("visivel")

  // Fechar o modal sem parar o vídeo
  document.getElementById("modal-player").classList.remove("aberto")
  document.body.style.overflow = ""

  // Ativar Wake Lock para manter tela/áudio no celular
  ativarWakeLock()

  // Habilitar interação após 200ms (evita click acidental ao minimizar)
  setTimeout(() => {
    document.getElementById("mini-video-wrap").classList.add("interativo")
  }, 200)
}

function expandirPlayer() {
  const miniWrap = document.getElementById("mini-video-wrap")
  const wrap     = document.getElementById("modal-video-wrap")
  const v        = videoAtual
  if (!v) return

  const mediaEl = miniWrap.querySelector("video, iframe")
  if (mediaEl) {
    if (mediaEl.tagName === "IFRAME") {
      // Recriar o iframe no player principal (YT reset)
      const iframe = document.createElement("iframe")
      iframe.src = mediaEl.src
      iframe.allow = mediaEl.allow
      iframe.allowFullscreen = true
      wrap.appendChild(iframe)
      mediaEl.remove()
    } else {
      mediaEl.style.cssText = ""
      wrap.appendChild(mediaEl)
    }
  }

  document.getElementById("mini-player").classList.remove("visivel")
  document.getElementById("mini-video-wrap").classList.remove("interativo")
  document.getElementById("modal-player").classList.add("aberto")
  document.body.style.overflow = "hidden"
}

function fecharMiniPlayer() {
  const miniWrap = document.getElementById("mini-video-wrap")
  const mediaEl  = miniWrap.querySelector("video, iframe")
  if (mediaEl) mediaEl.remove()
  document.getElementById("mini-player").classList.remove("visivel")
  document.getElementById("mini-video-wrap").classList.remove("interativo")
  liberarWakeLock()
  videoAtual = null
}

function toggleMiniAudio() {
  const video = document.getElementById("mini-video-wrap").querySelector("video")
    || document.getElementById("modal-video-wrap").querySelector("video")
  if (!video) return
  miniMudo = !miniMudo

// ── Wake Lock API (celular: manter áudio ativo) ──
async function ativarWakeLock() {
  if (!("wakeLock" in navigator)) return
  try {
    wakeLock = await navigator.wakeLock.request("screen")
    wakeLock.addEventListener("release", () => { wakeLock = null })
  } catch {}
}

function liberarWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null }
}

// Reativar Wake Lock ao voltar para a aba (celular libera ao trocar de aba)
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible") {
    const miniAtivo = document.getElementById("mini-player").classList.contains("visivel")
    if (miniAtivo) ativarWakeLock()
  }
  // Manter vídeo hospedado tocando em segundo plano
  const video = document.getElementById("player-video")
    || document.getElementById("mini-video-wrap").querySelector("video")
  if (video && document.hidden) {
    video.play().catch(() => {})
  }
})

// ── Drag do mini-player ──
;(function() {
  const mp = document.getElementById("mini-player")
  let dragging = false, ox = 0, oy = 0

  function onStart(e) {
    // Não arrastar se clicar nos botões ou no vídeo interativo
    if (e.target.closest(".mini-btn")) return
    if (e.target.closest(".mini-player-video.interativo")) return
    dragging = true
    const touch = e.touches ? e.touches[0] : e
    ox = touch.clientX - mp.getBoundingClientRect().left
    oy = touch.clientY - mp.getBoundingClientRect().top
    mp.style.transition = "none"
    e.preventDefault()
  }
  function onMove(e) {
    if (!dragging) return
    const touch = e.touches ? e.touches[0] : e
    let x = touch.clientX - ox
    let y = touch.clientY - oy
    // Limitar dentro da tela
    x = Math.max(0, Math.min(window.innerWidth  - mp.offsetWidth,  x))
    y = Math.max(0, Math.min(window.innerHeight - mp.offsetHeight, y))
    mp.style.left   = x + "px"
    mp.style.top    = y + "px"
    mp.style.right  = "auto"
    mp.style.bottom = "auto"
    e.preventDefault()
  }
  function onEnd() {
    dragging = false
    mp.style.transition = ""
  }

  mp.addEventListener("mousedown",  onStart, { passive: false })
  mp.addEventListener("touchstart", onStart, { passive: false })
  document.addEventListener("mousemove",  onMove,  { passive: false })
  document.addEventListener("touchmove",  onMove,  { passive: false })
  document.addEventListener("mouseup",    onEnd)
  document.addEventListener("touchend",   onEnd)
})()

function atualizarMediaSession(v) {
  if (!("mediaSession" in navigator)) return
  const thumb = getThumbnail(v)
  const artwork = thumb.type === "img" ? [{ src: thumb.src, sizes: "512x512" }] : []

  navigator.mediaSession.metadata = new MediaMetadata({
    title:  v.titulo  || "Vídeo",
    artist: v.autor   || "Omnisentis",
    album:  "Omnisentis",
    artwork
  })

  navigator.mediaSession.setActionHandler("previoustrack", () => tocarAnterior())
  navigator.mediaSession.setActionHandler("nexttrack",     () => tocarProximo())
}

// Captura frame do vídeo e coloca no lugar da tag video
function capturarFrame(videoEl) {
  try {
    const canvas = document.createElement("canvas")
    canvas.width  = videoEl.videoWidth  || 320
    canvas.height = videoEl.videoHeight || 180
    canvas.getContext("2d").drawImage(videoEl, 0, 0, canvas.width, canvas.height)
    const img = document.createElement("img")
    img.className = "video-thumb"
    img.src = canvas.toDataURL("image/jpeg", 0.8)
    img.style.cssText = "object-fit:cover;width:100%;height:100%;"
    videoEl.replaceWith(img)
  } catch {}
}
function filtrar() {
  document.getElementById("titulo-secao-todos").textContent = "🎬 Todos os vídeos"
  document.getElementById("btn-voltar-todos").classList.remove("visivel")
  const q = document.getElementById("busca-input").value.trim().toLowerCase()
  if (!q) { renderVideos(videos); return }

  const termos   = q.split(/\s+/)
  const tags     = termos.filter(t => t.startsWith("#")).map(t => t.slice(1))
  const textos   = termos.filter(t => !t.startsWith("#"))

  const resultado = videos.filter(v => {
    const titulo = v.titulo.toLowerCase()
    const autor  = (v.autor || "").toLowerCase()
    const desc   = (v.descricao || "").toLowerCase()
    const vTags  = Array.isArray(v.tags) ? v.tags : []
    const textoOk = textos.every(t => titulo.includes(t) || autor.includes(t) || desc.includes(t))
    const tagOk   = tags.every(tb => vTags.some(tl => tl.includes(tb)))
    return textoOk && tagOk
  })
  renderVideos(resultado)
}

    // Tentar buscar da lista de playlists públicas já carregadas no grid
    const cards = document.querySelectorAll("#grid-playlists-publicas .video-card")

    fetch(`${API}/playlists/publicas`)
      .then(r => r.json())
      .then(pls => {
        const found = pls.find(p => p.id === plId)
        if (found) _playPlaylistObj(found)
      })
      .catch(() => {})
    return
  }
  _playPlaylistObj(pl)
}

  const idsVideos = pl.videos || []

    .map(id => videos.find(v => v.id === id))
    .filter(Boolean)

  if (!videosPlaylist.length) {
    alert("Nenhum vídeo desta playlist foi encontrado. Os vídeos podem não ter sido carregados ainda.")
    return
  }

  // Substituir fila pelos vídeos da playlist em ordem
  fila = [...videosPlaylist]
  filaIndex = 0
  atualizarBotoesFila()

  // Tocar o primeiro e abrir painel da fila
  abrirPlayer(fila[0])
  abrirFilaPanel()
}

let plVideosSelecionados = new Set()

function renderCheckboxVideos(selecionados) {
  plVideosSelecionados = new Set(selecionados || [])
  const wrap = document.getElementById("pl-videos-lista")
  if (!videos.length) {
    wrap.innerHTML = '<div style="font-size:12px;color:#555;padding:8px;">Nenhum vídeo disponível.</div>'
    return
  }
  wrap.innerHTML = ""
  videos.forEach(v => {
    const item = document.createElement("div")
    item.className = "pl-grid-item" + (plVideosSelecionados.has(v.id) ? " selecionado" : "")
    item.dataset.id = v.id

    const thumb = getThumbnail(v)
    const thumbHtml = thumb.type === "img"
      ? `<img class="pl-grid-thumb" src="${thumb.src}" loading="lazy" onerror="this.style.display='none'">`
      : `<div class="pl-grid-thumb-placeholder">🎬</div>`

    item.innerHTML = `${thumbHtml}<div class="pl-grid-titulo">${v.titulo}</div>`
    item.addEventListener("click", (e) => {
      if (e.shiftKey && lastClickedPlItem !== null) {
        // Seleção por shift+click: seleciona range
        const ids = videos.map(vv => vv.id)
        const a = ids.indexOf(lastClickedPlItem)
        const b = ids.indexOf(v.id)
        const [from, to] = a < b ? [a, b] : [b, a]
        for (let i = from; i <= to; i++) plVideosSelecionados.add(ids[i])
      } else {
        if (plVideosSelecionados.has(v.id)) plVideosSelecionados.delete(v.id)
        else plVideosSelecionados.add(v.id)
      }
      lastClickedPlItem = v.id
      atualizarGridPl()
    })
    wrap.appendChild(item)
  })
  atualizarGridPl()
  iniciarRubberBand(wrap)
}

let lastClickedPlItem = null

function atualizarGridPl() {
  const items = document.querySelectorAll("#pl-videos-lista .pl-grid-item")
  items.forEach(item => {
    const id = parseInt(item.dataset.id)
    item.classList.toggle("selecionado", plVideosSelecionados.has(id))
  })
  const n = plVideosSelecionados.size
  document.getElementById("pl-sel-count").textContent =
    n === 0 ? "Nenhum vídeo selecionado" : `${n} vídeo${n !== 1 ? "s" : ""} selecionado${n !== 1 ? "s" : ""}`
}

function toggleTodosVideos() {
  if (plVideosSelecionados.size === videos.length) {
    plVideosSelecionados.clear()
  } else {
    videos.forEach(v => plVideosSelecionados.add(v.id))
  }
  atualizarGridPl()
}

// ── Rubber-band (seleção em área) ──
function iniciarRubberBand(container) {
  const rubber = document.getElementById("sel-rubber")
  let dragging = false, startX, startY

  container.addEventListener("mousedown", e => {
    if (e.button !== 0) return
    if (e.target.closest(".pl-grid-item")) return // clique direto no item, não arrastar
    dragging = true
    startX = e.clientX; startY = e.clientY
    rubber.style.cssText = `display:block;left:${startX}px;top:${startY}px;width:0;height:0;`
    e.preventDefault()
  })

  document.addEventListener("mousemove", e => {
    if (!dragging) return
    const x = Math.min(e.clientX, startX)
    const y = Math.min(e.clientY, startY)
    const w = Math.abs(e.clientX - startX)
    const h = Math.abs(e.clientY - startY)
    rubber.style.cssText = `display:block;left:${x}px;top:${y}px;width:${w}px;height:${h}px;`

    // Destacar itens que intersectam
    const rect = { left: x, right: x + w, top: y, bottom: y + h }
    document.querySelectorAll("#pl-videos-lista .pl-grid-item").forEach(item => {
      const r = item.getBoundingClientRect()
      const intersecta = r.left < rect.right && r.right > rect.left && r.top < rect.bottom && r.bottom > rect.top
      if (intersecta) item.style.outline = "2px solid var(--accent)"
      else item.style.outline = ""
    })
  })

  document.addEventListener("mouseup", e => {
    if (!dragging) return
    dragging = false
    rubber.style.display = "none"
    const x = Math.min(e.clientX, startX)
    const y = Math.min(e.clientY, startY)
    const w = Math.abs(e.clientX - startX)
    const h = Math.abs(e.clientY - startY)
    if (w < 5 && h < 5) return // clique simples, não arrastar
    const rect = { left: x, right: x + w, top: y, bottom: y + h }
    document.querySelectorAll("#pl-videos-lista .pl-grid-item").forEach(item => {
      item.style.outline = ""
      const r = item.getBoundingClientRect()
      if (r.left < rect.right && r.right > rect.left && r.top < rect.bottom && r.bottom > rect.top) {
        plVideosSelecionados.add(parseInt(item.dataset.id))
      }
    })
    atualizarGridPl()
  })
}

async function salvarPlaylist() {
  const nome      = document.getElementById("pl-nome").value.trim()
  const descricao = document.getElementById("pl-desc").value.trim()
  const publica   = document.getElementById("pl-publica").checked
  if (!nome) { alert("Digite um nome."); return }

  const videosSel = [...plVideosSelecionados]
  const body = { nome, descricao, publica, videos: videosSel }

  try {
    let res
    if (plEditandoId) {
      res = await fetch(`${API}/playlists/${plEditandoId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json", ...jwtHeader() },
        body: JSON.stringify(body)
      })
    } else {
      res = await fetch(`${API}/playlists`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...jwtHeader() },
        body: JSON.stringify(body)
      })
    }
    const data = await res.json()
    if (data.status === "ok") {
      await carregarPlaylists()
      renderGridPlaylists()
      fecharModalPL()
    } else {
      alert("Erro: " + data.message)
    }
  } catch {
    alert("Erro de conexão.")
  }
}

        <div id="conta-menu" style="display:none;position:absolute;right:0;top:110%;background:#111;border:1px solid rgba(255,215,0,0.2);border-radius:8px;min-width:160px;box-shadow:0 4px 20px rgba(0,0,0,0.8);z-index:100;">
          <div style="padding:10px 14px;font-size:12px;color:#888;border-bottom:1px solid #222;">${username}</div>
          <button onclick="sair()" style="width:100%;text-align:left;background:none;border:none;color:#f88;padding:10px 14px;font-size:13px;cursor:pointer;">🚪 Sair</button>
        </div>
      </div>`
    document.getElementById("conta-btn").addEventListener("click", e => {
      e.stopPropagation()
      const m = document.getElementById("conta-menu")
      m.style.display = m.style.display === "none" ? "block" : "none"
    })
    document.addEventListener("click", () => {
      const m = document.getElementById("conta-menu")
      if (m) m.style.display = "none"
    })
  } else {
    wrap.innerHTML = `<button onclick="location.href='login.html'" style="background:#fff;color:#111;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:bold;cursor:pointer;">Entrar</button>`
  }
}

window.sair = async function() {
  try { await _supa.auth.signOut() } catch {}
  localStorage.clear()
  sessionStorage.clear()
  location.href = "index.html"
}

document.addEventListener("keydown", e => { if (e.key === "Escape") { fecharPlayer(); fecharModalPL(); fecharModalAddPL() } })

// ── Segundo plano: manter vídeo tocando ao trocar de aba ──
// ── YouTube: detectar fim do vídeo via postMessage para autoplay ──
window.addEventListener("message", e => {
  try {
    const data = typeof e.data === "string" ? JSON.parse(e.data) : e.data
    if (data?.event === "onStateChange" && data?.info === 0) {
      if (autoplayAtivo) setTimeout(() => tocarProximo(), 1500)
    }
  } catch {}
})

init()
</script>
