<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="IconeSH.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Stronghold Library</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #111;
    }
    .card {
      background: #1a1a1a; border-radius: 14px; padding: 36px 32px;
      width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .card h1 { text-align: center; font-size: 20px; color: #eee; margin: 0 0 24px; }
    .abas { display: flex; border-radius: 8px; overflow: hidden; margin-bottom: 24px; border: 1px solid #333; }
    .aba { flex: 1; padding: 10px; text-align: center; font-size: 14px; cursor: pointer; background: #222; color: #888; border: none; transition: background 0.2s, color 0.2s; }
    .aba.ativa { background: #fff; color: #111; font-weight: bold; }
    .campo { display: none; flex-direction: column; gap: 10px; }
    .campo.ativo { display: flex; }
    .campo input { width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #eee; font-size: 15px; box-sizing: border-box; }
    .campo input:focus { outline: none; border-color: #666; }
    .campo input::placeholder { color: #666; }
    .campo button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #fff; color: #111; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 4px; }
    .campo button:hover { background: #ddd; }
    .campo button:disabled { background: #555; color: #999; cursor: not-allowed; }
    .msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; margin-top: 4px; }
    .msg.erro { background: #3a1a1a; color: #f88; border: 1px solid #622; }
    .msg.ok   { background: #1a3a1a; color: #8f8; border: 1px solid #262; }
    .voltar { display: block; text-align: center; margin-top: 20px; color: #666; font-size: 13px; text-decoration: none; }
    .voltar:hover { color: #aaa; }
  </style>
</head>
<body>

<div class="card">
  <h1><a href="index.html" style="color:inherit;text-decoration:none;">📚 Stronghold Library</a></h1>

  <div class="abas">
    <button class="aba ativa" onclick="trocarAba('login')">Entrar</button>
    <button class="aba"       onclick="trocarAba('registro')">Criar conta</button>
  </div>

  <div id="campo-login" class="campo ativo">
    <input id="login-email" type="email"    placeholder="E-mail" autocomplete="email">
    <input id="login-senha" type="password" placeholder="Senha"  autocomplete="current-password">
    <button id="btn-login" onclick="fazerLogin()">Entrar</button>
    <div id="msg-login" class="msg"></div>
  </div>

  <div id="campo-registro" class="campo">
    <input id="reg-nome"  type="text"     placeholder="Nome de usuário">
    <input id="reg-email" type="email"    placeholder="E-mail" autocomplete="email">
    <input id="reg-senha" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="new-password">
    <button id="btn-reg" onclick="fazerRegistro()">Criar conta</button>
    <div id="msg-reg" class="msg"></div>
  </div>
</div>

<a class="voltar" href="index.html">← Voltar para a biblioteca</a>

<!-- SDK Supabase direto no browser -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPA_URL = "https://iwggwgepwbrvmmrgsrvr.supabase.co"
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3Z2d3Z2Vwd2Jydm1tcmdzcnZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1Mzc4ODcsImV4cCI6MjA4OTExMzg4N30.BFaHUNavW7VOApg35r01SHsfjgYKUnhlT7YSADF9H6U"
const supa = supabase.createClient(SUPA_URL, SUPA_KEY)

// Se já estiver logado como usuário comum, redireciona
// Mas se vier da página admin (?from=admin), não redireciona automaticamente
const _next      = new URLSearchParams(location.search).get("next") || "livraria.html"
const _fromAdmin = new URLSearchParams(location.search).get("from") === "admin"
if (!_fromAdmin) {
  supa.auth.getSession().then(({ data }) => {
    if (data.session) location.href = _next
  })
}

function trocarAba(aba) {
  document.getElementById("campo-login").classList.toggle("ativo",    aba === "login")
  document.getElementById("campo-registro").classList.toggle("ativo", aba === "registro")
  document.querySelectorAll(".aba").forEach((b, i) => {
    b.classList.toggle("ativa", (i === 0 && aba === "login") || (i === 1 && aba === "registro"))
  })
  ;["msg-login","msg-reg"].forEach(id => {
    const el = document.getElementById(id)
    el.style.display = "none"
  })
}

async function fazerLogin() {
  const email = document.getElementById("login-email").value.trim()
  const senha = document.getElementById("login-senha").value
  const btn   = document.getElementById("btn-login")

  if (!email || !senha) { mostrarMsg("msg-login", "Preencha todos os campos.", "erro"); return }

  // Admin — continua pela rota do backend
  if (email === "admin" && senha === "1234") {
    btn.disabled = true; btn.textContent = "Entrando..."
    try {
      const res  = await fetch("https://edischinho-github-io.onrender.com/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user: "admin", password: "1234" })
      })
      const data = await res.json()
      if (data.status === "ok") {
        localStorage.setItem("sl_role",     "admin")
        localStorage.setItem("sl_username", "admin")
        location.href = "admin.html"
      } else {
        mostrarMsg("msg-login", "Credenciais inválidas.", "erro")
      }
    } catch { mostrarMsg("msg-login", "Erro de conexão.", "erro") }
    finally { btn.disabled = false; btn.textContent = "Entrar" }
    return
  }

  // Usuário comum — Supabase direto, sem backend
  btn.disabled = true; btn.textContent = "Entrando..."
  const { data, error } = await supa.auth.signInWithPassword({ email, password: senha })
  if (error) {
    mostrarMsg("msg-login", "E-mail ou senha incorretos.", "erro")
    btn.disabled = false; btn.textContent = "Entrar"
    return
  }

  // Sessão gerenciada pelo Supabase SDK automaticamente
  // Salva só o que as outras páginas precisam exibir
  localStorage.setItem("sl_role",     "user")
  localStorage.setItem("sl_username", data.user.user_metadata?.username || email.split("@")[0])
  location.href = _next
}

async function fazerRegistro() {
  const nome  = document.getElementById("reg-nome").value.trim()
  const email = document.getElementById("reg-email").value.trim()
  const senha = document.getElementById("reg-senha").value
  const btn   = document.getElementById("btn-reg")

  if (!nome || !email || !senha) { mostrarMsg("msg-reg", "Preencha todos os campos.", "erro"); return }
  if (senha.length < 6)          { mostrarMsg("msg-reg", "Senha deve ter mínimo 6 caracteres.", "erro"); return }

  btn.disabled = true; btn.textContent = "Criando conta..."
  const { error } = await supa.auth.signUp({
    email,
    password: senha,
    options: { data: { username: nome } }
  })

  if (error) {
    const msg = error.message.includes("already")
      ? "Este e-mail já está cadastrado."
      : error.message
    mostrarMsg("msg-reg", msg, "erro")
  } else {
    mostrarMsg("msg-reg", "✅ Conta criada! Agora faça login.", "ok")
    setTimeout(() => {
      document.getElementById("login-email").value = email
      trocarAba("login")
    }, 1500)
  }

  btn.disabled = false; btn.textContent = "Criar conta"
}

function mostrarMsg(id, msg, tipo) {
  const el = document.getElementById(id)
  el.textContent = msg; el.className = `msg ${tipo}`; el.style.display = "block"
}

document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return
  document.getElementById("campo-login").classList.contains("ativo") ? fazerLogin() : fazerRegistro()
})
</script>

</body>
</html>
