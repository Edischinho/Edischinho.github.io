<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="IconeSH.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Stronghold Library</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #111;
    }
    .card {
      background: #1a1a1a; border-radius: 14px; padding: 36px 32px;
      width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .card h1 { text-align: center; font-size: 20px; color: #eee; margin: 0 0 8px; }
    .card p  { text-align: center; font-size: 13px; color: #666; margin: 0 0 24px; }
    .campo { display: flex; flex-direction: column; gap: 10px; }
    .campo input {
      width: 100%; padding: 11px 14px; border-radius: 8px;
      border: 1px solid #333; background: #2a2a2a; color: #eee;
      font-size: 15px; box-sizing: border-box;
    }
    .campo input:focus { outline: none; border-color: #666; }
    .campo input::placeholder { color: #666; }
    .campo button {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      background: #fff; color: #111; font-size: 15px; font-weight: bold;
      cursor: pointer; margin-top: 4px; transition: background 0.2s;
    }
    .campo button:hover    { background: #ddd; }
    .campo button:disabled { background: #555; color: #999; cursor: not-allowed; }
    .msg {
      padding: 10px 14px; border-radius: 8px; font-size: 13px;
      display: none; margin-top: 4px;
    }
    .msg.erro { background: #3a1a1a; color: #f88; border: 1px solid #622; }
    .voltar {
      display: block; text-align: center; margin-top: 20px;
      color: #666; font-size: 13px; text-decoration: none;
    }
    .voltar:hover { color: #aaa; }
  </style>
</head>
<body>

<div class="card">
  <h1><a href="index.html" style="color:inherit;text-decoration:none;">📚 Stronghold Library</a></h1>
  <p>Acesso restrito — administração</p>

  <div class="campo">
    <input id="user" placeholder="Usuário" autocomplete="username">
    <input id="pass" type="password" placeholder="Senha" autocomplete="current-password">
    <button id="btn-login" onclick="fazerLogin()">Entrar</button>
    <div id="msg" class="msg"></div>
  </div>
</div>

<a class="voltar" href="index.html">← Voltar</a>

<script>
const API = "https://edischinho-github-io.onrender.com"

// Acorda o Render
fetch(`${API}/`, { method: "GET", mode: "cors" }).catch(() => {})

async function fazerLogin() {
  const user = document.getElementById("user").value.trim()
  const pass = document.getElementById("pass").value
  const btn  = document.getElementById("btn-login")

  if (!user || !pass) { mostrarMsg("Preencha todos os campos.", "erro"); return }

  btn.disabled = true; btn.textContent = "Entrando..."

  try {
    const res  = await fetch(`${API}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user, password: pass })
    })
    const data = await res.json()

    if (data.status === "ok") {
      localStorage.setItem("sl_role",     "admin")
      localStorage.setItem("sl_username", "admin")
      location.href = "admin.html"
    } else {
      mostrarMsg("Usuário ou senha incorretos.", "erro")
    }
  } catch {
    mostrarMsg("Erro de conexão com o servidor.", "erro")
  } finally {
    btn.disabled = false; btn.textContent = "Entrar"
  }
}

function mostrarMsg(msg, tipo) {
  const el = document.getElementById("msg")
  el.textContent = msg; el.className = `msg ${tipo}`; el.style.display = "block"
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter") fazerLogin()
})
</script>

</body>
</html>
