<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>Painel Admin</header>

<div class="container">

<input id="titulo" placeholder="Título do livro">

<br><br>

<label>Capa</label>

<input type="file" id="capa">

<br><br>

<label>PDF</label>

<input type="file" id="pdf">

<br><br>

<button onclick="enviar()">Enviar livro</button>

</div>

<script>

async function enviar(){

let titulo=document.getElementById("titulo").value
let capa=document.getElementById("capa").files[0]
let pdf=document.getElementById("pdf").files[0]

let form=new FormData()

form.append("titulo",titulo)
form.append("capa",capa)
form.append("pdf",pdf)

let res=await fetch("https://edischinho-github-io.onrender.com/addLivro",{

method:"POST",
body:form

})

let data=await res.json()

if(data.status==="ok"){
alert("Livro enviado")
}

}

</script>

</body>

</html>
