<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h2>Adicionar Livro</h2>
<input id="titulo" placeholder="Título do livro">
<input type="file" id="capa">
<button onclick="addLivro()">Enviar</button>

<script>
async function addLivro(){
  const titulo = document.getElementById("titulo").value
  const file = document.getElementById("capa").files[0]

  const formData = new FormData()
  formData.append("titulo", titulo)
  formData.append("capa", file)

  const res = await fetch("https://SEU_BACKEND_RENDER/addLivro",{
    method:"POST",
    body: formData
  })

  const data = await res.json()
  if(data.status==="ok") alert("Livro enviado!")
  else alert("Erro: "+data.message)
}
</script>
</body>
</html>
