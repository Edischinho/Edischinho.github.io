<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livraria</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h2>Livraria</h2>
<input id="search" placeholder="Buscar livro">
<button onclick="filtrar()">Pesquisar</button>
<div id="livros"></div>

<script>
let livros = []

async function carregarLivros(){
  const res = await fetch("https://SEU_BACKEND_RENDER/livros")
  livros = await res.json()
  mostrarLivros(livros)
}

function mostrarLivros(lista){
  const div = document.getElementById("livros")
  div.innerHTML = ""
  lista.forEach(l=>{
    const card = document.createElement("div")
    card.innerHTML = `<h3>${l.titulo}</h3>
                      <a href="${l.capa}" target="_blank">Abrir livro</a>`
    div.appendChild(card)
  })
}

function filtrar(){
  const termo = document.getElementById("search").value.toLowerCase()
  mostrarLivros(livros.filter(l=>l.titulo.toLowerCase().includes(termo)))
}

carregarLivros()
</script>
</body>
</html>
