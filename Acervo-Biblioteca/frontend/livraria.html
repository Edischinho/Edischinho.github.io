<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="IconeSH.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria — Omnisentis</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .tag-pill {
      display: inline-block;
      background: #222;
      color: white;
      border-radius: 20px;
      padding: 2px 9px;
      font-size: 11px;
      margin: 3px 2px 0;
      cursor: pointer;
      transition: background 0.15s;
    }
    .tag-pill:hover { background: #555; }
    .busca-hint {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: -16px;
      margin-bottom: 18px;
    }
    /* ── Capa do livro ── */
    .livro-capa {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border-radius: 6px 6px 0 0;
      display: block;
      background: #ddd;
    }
    .livro-sem-capa {
      width: 100%;
      aspect-ratio: 2/3;
      background: linear-gradient(135deg, #2a2a2a, #444);
      border-radius: 6px 6px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }
    .livro {
      padding: 0 !important;
      overflow: hidden;
    }
    .livro-info {
      padding: 12px;
    }
    .livro .btn-abrir {
      display: block;
      margin: 0 12px 12px;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      .tag-pill { background: #ddd; color: #111; }
      .tag-pill:hover { background: #bbb; }
      .busca-hint { color: #666; }
      .livro-sem-capa { background: linear-gradient(135deg, #1a1a1a, #333); }
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<header style="display:flex;align-items:center;justify-content:space-between;padding:15px 20px;">
  <a href="index.html" style="color:inherit;text-decoration:none;">Omnisentis</a>
  <div id="btn-conta-wrap"></div>
</header>

<div class="container">
  <div class="busca">
    <input id="search" placeholder="Buscar por título, autor ou #tag...">
    <button onclick="filtrar()">Pesquisar</button>
  </div>
  <p class="busca-hint">Misture livremente: "tolkien #fantasia" · "#romance aventura"</p>

  <div id="livros"></div>
</div>

<footer>Criado por Hiru Tagamashi</footer>

<script>
const API = "https://edischinho-github-io.onrender.com"
let livros = []

async function acordarServidor() {
  try { await fetch(`${API}/`, { method: "GET", mode: "cors" }) } catch (_) {}
}

async function carregarLivros(tentativa = 1) {
  const div = document.getElementById("livros")

  if (tentativa === 1) {
    div.innerHTML = "<p>Conectando ao servidor...</p>"
    await acordarServidor()
  }

  try {
    const controller = new AbortController()
    const timeout = setTimeout(() => controller.abort(), 10000)
    const res = await fetch(`${API}/livros`, { signal: controller.signal })
    clearTimeout(timeout)

    livros = await res.json()
    mostrarLivros(livros)
  } catch (err) {
    if (tentativa < 4) {
      const espera = tentativa * 3
      div.innerHTML = `<p>Servidor acordando... tentativa ${tentativa}/3. Aguarde ${espera}s.</p>`
      setTimeout(() => carregarLivros(tentativa + 1), espera * 1000)
    } else {
      div.innerHTML = `
        <p>Não foi possível conectar ao servidor.</p>
        <button onclick="carregarLivros()">🔄 Tentar novamente</button>
      `
    }
  }
}

function mostrarLivros(lista) {
  const div = document.getElementById("livros")

  if (!lista.length) {
    div.innerHTML = "<p>Nenhum livro encontrado.</p>"
    return
  }

  div.innerHTML = ""
  lista.forEach(l => {
    const card = document.createElement("div")
    card.className = "livro"

    const isPDF = l.arquivo_url && l.arquivo_url.toLowerCase().endsWith(".pdf")

    // Tags clicáveis — clicar numa tag pesquisa por ela
    const tagsPills = Array.isArray(l.tags) && l.tags.length
      ? l.tags.map(t =>
          `<span class="tag-pill" onclick="pesquisarTag('${t}')">#${t}</span>`
        ).join("")
      : ""

    const capaHtml = l.capa_url
      ? `<img class="livro-capa" src="${l.capa_url}" alt="Capa de ${l.titulo}" loading="lazy">`
      : `<div class="livro-sem-capa">📚</div>`

    card.innerHTML = `
      ${capaHtml}
      <div class="livro-info">
        <h3>${l.titulo}</h3>
        ${l.autor     ? `<p class="autor">${l.autor}</p>` : ""}
        ${l.descricao ? `<p class="descricao">${l.descricao}</p>` : ""}
        <div>${tagsPills}</div>
      </div>
      <a class="btn-abrir"
         href="${isPDF ? "leitor.html?pdf=" + encodeURIComponent(l.arquivo_url) : l.arquivo_url}"
         target="${isPDF ? "_self" : "_blank"}">
        ${isPDF ? "📖 Ler" : "⬇ Baixar"}
      </a>
    `
    div.appendChild(card)
  })
}

// Coloca a tag no campo de busca e filtra
function pesquisarTag(tag) {
  document.getElementById("search").value = "#" + tag
  filtrar()
}

function filtrar() {
  const input = document.getElementById("search").value.trim().toLowerCase()
  if (!input) { mostrarLivros(livros); return }

  // Separar termos: palavras normais e #tags
  const termos = input.split(/\s+/)
  const tagsBuscadas  = termos.filter(t => t.startsWith("#")).map(t => t.slice(1))
  const textosBuscados = termos.filter(t => !t.startsWith("#"))

  const resultado = livros.filter(l => {
    const titulo = l.titulo.toLowerCase()
    const autor  = (l.autor || "").toLowerCase()
    const tagsLivro = Array.isArray(l.tags) ? l.tags : []

    // Todos os textos livres devem bater em título ou autor
    const textoOk = textosBuscados.every(t =>
      titulo.includes(t) || autor.includes(t)
    )

    // Todas as #tags buscadas devem estar no livro
    const tagOk = tagsBuscadas.every(tb =>
      tagsLivro.some(tl => tl.includes(tb))
    )

    return textoOk && tagOk
  })

  mostrarLivros(resultado)
}

// Filtrar ao digitar
document.getElementById("search").addEventListener("input", filtrar)

carregarLivros()
</script>

</body>
</html>
