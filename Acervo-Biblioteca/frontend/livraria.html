<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stronghold Library</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
Stronghold Library
</header>

<div class="container">

<div class="busca">

<input id="busca" placeholder="Pesquisar livro">

<button onclick="pesquisar()">Pesquisar</button>

</div>

<div id="livros"></div>

</div>

<footer>
Criado por Hiru Tagamashi
</footer>

<script>

let lista=[]

async function carregar(){

let res=await fetch("https://edischinho-github-io.onrender.com/livros")

lista=await res.json()

mostrar(lista)

}

function mostrar(livros){

let div=document.getElementById("livros")

div.innerHTML=""

livros.forEach(l=>{

div.innerHTML+=`

<div class="livro">

<img src="https://edischinho-github-io.onrender.com/${l.capa}">

<p>${l.titulo}</p>

<a href="leitor.html?pdf=${l.pdf}">
<button>Ler</button>
</a>

</div>

`

})

}

function pesquisar(){

let t=document.getElementById("busca").value.toLowerCase()

let filtrados=lista.filter(l=>
l.titulo.toLowerCase().includes(t)
)

mostrar(filtrados)

}

carregar()

</script>

</body>

</html>
