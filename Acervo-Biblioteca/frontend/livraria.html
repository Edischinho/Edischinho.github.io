<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Livraria</title>

<style>

body{
font-family:Arial;
padding:20px;
}

#busca{
padding:10px;
width:250px;
}

button{
padding:10px;
}

#livros{
margin-top:20px;
display:grid;
grid-template-columns:repeat(auto-fill,150px);
gap:20px;
}

.livro{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

.livro img{
width:120px;
height:160px;
object-fit:cover;
}

</style>

</head>

<body>

<h1>Livraria</h1>

<input id="busca" placeholder="Nome do livro">
<button onclick="pesquisar()">Pesquisar</button>

<div id="livros"></div>

<script>

let livros=[]

async function carregar(){

let res=await fetch("https://edischinho-github-io.onrender.com/livros")

livros=await res.json()

mostrar(livros)

}

function mostrar(lista){

let container=document.getElementById("livros")

container.innerHTML=""

lista.forEach(livro=>{

let div=document.createElement("div")

div.className="livro"

div.innerHTML=`
<img src="https://edischinho-github-io.onrender.com/${livro.capa}">
<p>${livro.titulo}</p>
`

container.appendChild(div)

})

}

function pesquisar(){

let texto=document.getElementById("busca").value.toLowerCase()

let filtrados=livros.filter(livro=>
livro.titulo.toLowerCase().includes(texto)
)

mostrar(filtrados)

}

carregar()

</script>

</body>

</html>
