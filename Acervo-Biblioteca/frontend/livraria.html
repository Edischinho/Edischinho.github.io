<!DOCTYPE html>
<html>

<body>

<h1>Livraria</h1>

<input id="busca" placeholder="Pesquisar">

<button onclick="pesquisar()">Pesquisar</button>

<div id="livros"></div>

<script>

let lista=[]

async function carregar(){

let res=await fetch("https://edischinho-github-io.onrender.com/livros")

lista=await res.json()

mostrar(lista)

}

function mostrar(livros){

let div=document.getElementById("livros")

div.innerHTML=""

livros.forEach(l=>{

div.innerHTML+=`

<div>

<img width="120" src="https://edischinho-github-io.onrender.com/${l.capa}">

<p>${l.titulo}</p>

<a href="leitor.html?pdf=${l.pdf}">
<button>Ler</button>
</a>

</div>

`

})

}

function pesquisar(){

let t=document.getElementById("busca").value.toLowerCase()

let f=lista.filter(l=>l.titulo.toLowerCase().includes(t))

mostrar(f)

}

carregar()

</script>

</body>
</html>
