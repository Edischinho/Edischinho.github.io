<html>
<head>
  <meta charset="UTF-8">

  <title>Omnisentis</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #000;
      color: #eee;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Canvas de partículas ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,215,0,0.15);
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255,215,0,0.5);
    }

    /* ── Centro ── */
    .centro {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .titulo-principal {
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      font-weight: bold;
      line-height: 1.1;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffd700 0%, #ffe44d 40%, #fff8dc 70%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(255,215,0,0.4));
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(255,215,0,0.3)); }
      50%       { filter: drop-shadow(0 0 50px rgba(255,215,0,0.7)); }
    }

    .subtitulo {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      color: rgba(255,255,255,0.45);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 56px;
    }

    /* ── Botões ── */
    .botoes {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 20px 28px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,215,0,0.2);
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
      min-width: 120px;
      color: #eee;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .btn-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255,215,0,0.12), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255,215,0,0.7);
      background: rgba(255,215,0,0.06);
      box-shadow: 0 8px 32px rgba(255,215,0,0.2), 0 0 0 1px rgba(255,215,0,0.15);
    }

    .btn-card:hover::before { opacity: 1; }

    .btn-card:active { transform: translateY(-1px); }

    .btn-icon {
      font-size: 28px;
      line-height: 1;
      filter: drop-shadow(0 0 8px rgba(255,215,0,0.4));

      height: 1px;

      position: relative;
      z-index: 10;
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 1px;

      color: #ffd700;
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 8px;

      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #btn-conta-wrap button:hover { background: rgba(255,215,0,0.2); }

    @media (max-width: 480px) {
      .btn-card { padding: 16px 20px; min-width: 100px; }
      .btn-icon  { font-size: 22px; }
    }
  </style>

<!-- Partículas -->
<script>
(function() {
  const canvas = document.getElementById("bg-canvas")
  const ctx    = canvas.getContext("2d")
  let W, H, particles = [], lines = []

  function resize() {
    W = canvas.width  = window.innerWidth
    H = canvas.height = window.innerHeight
  }
  resize()
  window.addEventListener("resize", () => { resize(); init() })

  // Partículas brilhantes
  class Particle {
    constructor() { this.reset() }
    reset() {
      this.x    = Math.random() * W
      this.y    = Math.random() * H
      this.r    = Math.random() * 1.5 + 0.3
      this.vx   = (Math.random() - 0.5) * 0.3
      this.vy   = (Math.random() - 0.5) * 0.3
      this.alpha = Math.random() * 0.6 + 0.1
      this.pulse = Math.random() * Math.PI * 2
      this.pulseSpeed = Math.random() * 0.02 + 0.005
    }
    update() {
      this.x += this.vx
      this.y += this.vy
      this.pulse += this.pulseSpeed
      if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset()
    }
    draw() {
      const a = this.alpha * (0.6 + 0.4 * Math.sin(this.pulse))
      ctx.beginPath()
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2)
      ctx.fillStyle = `rgba(255,215,0,${a})`
      ctx.fill()
    }
  }

  function init() {
    const N = Math.floor(W * H / 8000)
    particles = Array.from({ length: N }, () => new Particle())
  }
  init()

  let mouse = { x: W / 2, y: H / 2 }
  window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY })

  function draw() {
    ctx.clearRect(0, 0, W, H)

    // Fundo gradiente radial centrado no mouse
    const grd = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, Math.max(W, H) * 0.7)
    grd.addColorStop(0,   "rgba(255,215,0,0.06)")
    grd.addColorStop(0.4, "rgba(255,180,0,0.02)")
    grd.addColorStop(1,   "rgba(0,0,0,0)")
    ctx.fillStyle = grd
    ctx.fillRect(0, 0, W, H)

    // Linhas entre partículas próximas
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x
        const dy = particles[i].y - particles[j].y
        const dist = Math.sqrt(dx * dx + dy * dy)
        if (dist < 120) {
          ctx.beginPath()
          ctx.moveTo(particles[i].x, particles[i].y)
          ctx.lineTo(particles[j].x, particles[j].y)
          ctx.strokeStyle = `rgba(255,215,0,${0.08 * (1 - dist / 120)})`
          ctx.lineWidth = 0.5
          ctx.stroke()
        }
      }
    }

    // Partículas
    particles.forEach(p => { p.update(); p.draw() })

    // Reflexo do mouse
    const mg = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 80)
    mg.addColorStop(0,   "rgba(255,215,0,0.08)")
    mg.addColorStop(1,   "rgba(255,215,0,0)")
    ctx.fillStyle = mg
    ctx.fillRect(0, 0, W, H)

    requestAnimationFrame(draw)
  }
  draw()
})()
</script>
