<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="IconeSH.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor — Stronghold Library</title>
  <style>
    body { margin: 0; background: #111; font-family: Arial, sans-serif; color: white; }

    /* ── Barra superior ── */
    .topo {
      position: sticky; top: 0; background: #000;
      padding: 10px 16px; display: flex; align-items: center;
      gap: 10px; z-index: 20; box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      flex-wrap: wrap;
    }
    .topo a { color: #aaa; text-decoration: none; font-size: 14px; white-space: nowrap; }
    .topo a:hover { color: white; }
    .topo-titulo {
      flex: 1; text-align: center; font-size: 14px;
      color: #ccc; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; min-width: 0;
    }
    .controles { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ctrl-btn {
      background: #222; color: white; border: none;
      border-radius: 6px; padding: 6px 12px; font-size: 13px;
      cursor: pointer; transition: background 0.15s; white-space: nowrap;
    }
    .ctrl-btn:hover { background: #444; }
    .ctrl-btn.ativo { background: #ffd700; color: #111; }

    .ir-pagina { display: flex; align-items: center; gap: 5px; }
    .ir-pagina input {
      width: 52px; padding: 5px 7px; font-size: 13px;
      border-radius: 6px; border: 1px solid #444;
      background: #222; color: white; text-align: center;
    }
    .ir-pagina input:focus { outline: 2px solid #888; }
    .pagina-info { font-size: 12px; color: #888; white-space: nowrap; }

    /* ── Viewer ── */
    #viewer { max-width: 900px; margin: auto; padding: 10px; }
    .page { margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; scroll-margin-top: 70px; }
    .pdf-canvas { display: block; width: 100%; background: white; border-radius: 5px; box-shadow: 0 0 8px rgba(0,0,0,0.6); }
    .placeholder { width: 100%; height: 900px; background: #222; border-radius: 5px; }
    #erro { text-align: center; padding: 40px; color: #f66; }
    .page.destaque .pdf-canvas { box-shadow: 0 0 0 3px #ffd700, 0 0 16px rgba(255,215,0,0.4); }

    /* ── Indicador de anotação na página ── */
    .nota-badge {
      align-self: flex-end;
      margin-top: 4px; margin-right: 4px;
      background: #ffd700; color: #111;
      border-radius: 12px; padding: 2px 9px;
      font-size: 11px; font-weight: bold;
      cursor: pointer; user-select: none;
      transition: transform 0.1s;
    }
    .nota-badge:hover { transform: scale(1.08); }

    /* ── Drawer de anotações ── */
    #drawer {
      position: fixed; top: 0; right: -420px;
      width: 400px; max-width: 95vw; height: 100vh;
      background: #1a1a1a; z-index: 30;
      box-shadow: -4px 0 24px rgba(0,0,0,0.7);
      transition: right 0.3s ease;
      display: flex; flex-direction: column;
    }
    #drawer.aberto { right: 0; }

    .drawer-header {
      padding: 16px 18px; background: #111;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #2a2a2a; flex-shrink: 0;
    }
    .drawer-header h3 { margin: 0; font-size: 15px; color: #eee; }
    .drawer-fechar {
      background: none; border: none; color: #888;
      font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1;
    }
    .drawer-fechar:hover { color: white; }

    /* ── Área de edição da anotação atual ── */
    .nota-atual {
      padding: 16px 18px; border-bottom: 1px solid #2a2a2a; flex-shrink: 0;
    }
    .nota-atual label {
      font-size: 12px; color: #888; display: block; margin-bottom: 6px;
    }
    .nota-atual textarea {
      width: 100%; box-sizing: border-box;
      background: #2a2a2a; color: #eee; border: 1px solid #333;
      border-radius: 8px; padding: 10px; font-size: 14px;
      resize: vertical; min-height: 100px; font-family: Arial, sans-serif;
    }
    .nota-atual textarea:focus { outline: none; border-color: #ffd700; }
    .nota-atual-btns {
      display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end;
    }
    .btn-salvar {
      background: #ffd700; color: #111; border: none;
      border-radius: 6px; padding: 7px 16px; font-size: 13px;
      font-weight: bold; cursor: pointer; transition: background 0.15s;
    }
    .btn-salvar:hover { background: #ffe44d; }
    .btn-salvar:disabled { background: #555; color: #999; cursor: not-allowed; }
    .btn-apagar {
      background: #3a1a1a; color: #f88; border: 1px solid #622;
      border-radius: 6px; padding: 7px 12px; font-size: 13px;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-apagar:hover { background: #4a2020; }
    .salvo-msg { font-size: 12px; color: #8f8; align-self: center; opacity: 0; transition: opacity 0.3s; }
    .salvo-msg.visivel { opacity: 1; }

    /* ── Lista de todas as anotações ── */
    .notas-lista { flex: 1; overflow-y: auto; padding: 14px 18px; }
    .notas-lista h4 { font-size: 12px; color: #666; margin: 0 0 12px; text-transform: uppercase; }
    .nota-item {
      background: #222; border-radius: 8px; padding: 10px 12px;
      margin-bottom: 10px; cursor: pointer; transition: background 0.15s;
      border-left: 3px solid #ffd700;
    }
    .nota-item:hover { background: #2a2a2a; }
    .nota-item-pag { font-size: 11px; color: #ffd700; font-weight: bold; margin-bottom: 4px; }
    .nota-item-texto { font-size: 13px; color: #ccc; white-space: pre-wrap; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .notas-vazia { color: #555; font-size: 13px; text-align: center; margin-top: 30px; }

    /* ── Overlay escuro ao abrir drawer ── */
    #overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 25;
    }
    #overlay.visivel { display: block; }

    /* ── Sem login ── */
    .sem-login {
      padding: 20px 18px; color: #888; font-size: 13px; text-align: center;
    }
    .sem-login a { color: #ffd700; }

    /* ── Exportar ── */
    .btn-exportar-todas {
      background: #2a2a2a; color: #ffd700; border: 1px solid #444;
      border-radius: 6px; padding: 4px 10px; font-size: 11px;
      cursor: pointer; white-space: nowrap; transition: background 0.15s;
    }
    .btn-exportar-todas:hover { background: #333; }

    .nota-item-exportar {
      background: none; border: none; color: #666;
      font-size: 11px; cursor: pointer; padding: 2px 6px;
      border-radius: 4px; transition: color 0.15s;
      flex-shrink: 0;
    }
    .nota-item-exportar:hover { color: #ffd700; }

    /* ── Modal de exportação ── */
    #modal-exportar {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 50;
      align-items: center; justify-content: center;
    }
    #modal-exportar.aberto { display: flex; }
    .modal-exp {
      background: #1a1a1a; border-radius: 14px;
      padding: 28px 24px; width: 90%; max-width: 480px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    }
    .modal-exp h3 { margin: 0 0 6px; font-size: 16px; color: #eee; }
    .modal-exp p  { margin: 0 0 16px; font-size: 12px; color: #888; }
    .modal-exp textarea {
      width: 100%; box-sizing: border-box;
      background: #111; color: #ccc; border: 1px solid #333;
      border-radius: 8px; padding: 12px; font-size: 13px;
      font-family: monospace; resize: vertical; min-height: 200px;
    }
    .modal-exp-btns {
      display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px;
    }
    .btn-fechar-exp {
      background: #2a2a2a; color: #aaa; border: none;
      border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer;
    }
    .btn-fechar-exp:hover { background: #333; }
    .btn-dl-txt {
      background: #ffd700; color: #111; border: none;
      border-radius: 6px; padding: 8px 16px; font-size: 13px;
      font-weight: bold; cursor: pointer;
    }
    .btn-dl-txt:hover { background: #ffe44d; }

    /* ── Sistema de marcações (canvas livre) ── */
    .page { position: relative; }

    /* Seletor de cores */
    .cores-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .cor-btn {
      width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; transition: transform 0.15s, border-color 0.15s; flex-shrink: 0;
    }
    .cor-btn:hover { transform: scale(1.2); }
    .cor-btn.ativa { border-color: white; transform: scale(1.15); }
    .cor-btn.apagar { background: #333; border: 2px dashed #888; font-size: 13px;
                      display:flex; align-items:center; justify-content:center; color:#aaa; }

    /* Canvas de desenho — sobreposto ao PDF, fora do fluxo */
    .draw-canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 5px;
      pointer-events: none;
      /* touch-action só ativo no modo HL — via JS */
    }
    .modoHL .draw-canvas { cursor: crosshair; pointer-events: auto; touch-action: none; }

    /* Popover */
    #hl-popover {
      position: fixed; z-index: 200;
      background: #1e1e1e; border: 1px solid #444; border-radius: 10px;
      padding: 12px 14px; max-width: 280px; min-width: 180px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.7); display: none;
    }
    #hl-popover.visivel { display: block; }
    .hl-pop-cor   { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
    .hl-pop-texto { font-size:13px; color:#ccc; margin:6px 0; white-space:pre-wrap; word-break:break-word; max-height:80px; overflow:hidden; }
    .hl-pop-vazia { font-size:12px; color:#666; margin:6px 0; font-style:italic; }
    .hl-pop-btns  { display:flex; gap:8px; margin-top:10px; }
    .hl-pop-btn   { flex:1; padding:6px; border:none; border-radius:6px; font-size:12px; cursor:pointer; font-weight:bold; }
    .hl-pop-abrir { background:#ffd700; color:#111; }
    .hl-pop-abrir:hover { background:#ffe44d; }
    .hl-pop-del   { background:#3a1a1a; color:#f88; border:1px solid #622; }
    .hl-pop-del:hover { background:#4a2020; }

    /* Item no drawer */
    .hl-item { background:#222; border-radius:8px; padding:10px 12px; margin-bottom:8px;
                cursor:pointer; display:flex; align-items:center; gap:8px; }
    .hl-item:hover { background:#2a2a2a; }
    .hl-item-cor  { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
    .hl-item-info { flex:1; min-width:0; }
    .hl-item-pag  { font-size:11px; color:#888; margin-bottom:2px; }
    .hl-item-nota { font-size:12px; color:#ccc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    @media (max-width: 600px) {
      .topo-titulo { display: none; }
      .ctrl-btn { padding: 6px 9px; font-size: 12px; }
      #drawer { width: 100vw; max-width: 100vw; }
    }
  </style>
</head>
<body>

<div class="topo">
  <a href="javascript:history.back()">← Voltar</a>
  <span class="topo-titulo"><a href="index.html" style="color:inherit;text-decoration:none;">Stronghold Library</a> — Leitor</span>
  <div class="controles">
    <div class="ir-pagina">
      <input id="input-pagina" type="number" min="1" placeholder="Pág." title="Ir para página">
      <button class="ctrl-btn" onclick="irParaPagina()">Ir</button>
      <span class="pagina-info" id="pagina-info">Pág. — / —</span>
    </div>
    <button class="ctrl-btn" id="btn-notas" onclick="toggleDrawer()" title="Minhas anotações">📝 Notas</button>
    <button class="ctrl-btn" id="btn-hl" onclick="toggleModoHL()" title="Marcar texto">🖍 Destacar</button>
    <div class="cores-wrap" id="cores-wrap" style="display:none">
      <span style="font-size:11px;color:#888;">Cor:</span>
      <div class="cor-btn" style="background:#facc15" data-cor="#facc15" title="Amarelo"  onclick="selecionarCor(this,'#facc15')"></div>
      <div class="cor-btn" style="background:#86efac" data-cor="#86efac" title="Verde"    onclick="selecionarCor(this,'#86efac')"></div>
      <div class="cor-btn" style="background:#93c5fd" data-cor="#93c5fd" title="Azul"     onclick="selecionarCor(this,'#93c5fd')"></div>
      <div class="cor-btn" style="background:#f9a8d4" data-cor="#f9a8d4" title="Rosa"     onclick="selecionarCor(this,'#f9a8d4')"></div>
      <div class="cor-btn" style="background:#fca5a5" data-cor="#fca5a5" title="Vermelho" onclick="selecionarCor(this,'#fca5a5')"></div>
      <div class="cor-btn" style="background:#d8b4fe" data-cor="#d8b4fe" title="Roxo"     onclick="selecionarCor(this,'#d8b4fe')"></div>
      <div class="cor-btn apagar" data-cor="" title="Apagar highlight" onclick="selecionarCor(this,'')">✕</div>
    </div>
    <button class="ctrl-btn" onclick="baixarPDF()" title="Baixar PDF">⬇ Download</button>
    <div id="btn-conta-wrap" style="position:relative"></div>
  </div>
</div>

<div id="viewer"></div>
<!-- Popover de highlight -->
<div id="hl-popover">
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
    <span class="hl-pop-cor" id="hl-pop-cor"></span>
    <span style="font-size:12px;color:#888;" id="hl-pop-pag"></span>
  </div>
  <div id="hl-pop-nota"></div>
  <div class="hl-pop-btns">
    <button class="hl-pop-btn hl-pop-abrir" onclick="abrirNotaDoHL()">📝 Ver nota</button>
    <button class="hl-pop-btn hl-pop-del"   onclick="deletarHLAtual()">🗑 Remover</button>
  </div>
</div>
<div id="erro" style="display:none"></div>

<!-- ── Overlay ── -->
<div id="overlay" onclick="fecharDrawer()"></div>

<!-- ── Drawer de anotações ── -->
<div id="drawer">
  <div class="drawer-header">
    <div style="display:flex;gap:8px;">
      <button id="tab-notas"     onclick="trocarAbaDrawer('notas')"     style="background:#ffd700;color:#111;border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:bold;cursor:pointer;">📝 Notas</button>
      <button id="tab-marcacoes" onclick="trocarAbaDrawer('marcacoes')" style="background:#333;color:#ccc;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;">🔖 Marcações</button>
    </div>
    <button class="drawer-fechar" onclick="fecharDrawer()">✕</button>
  </div>

  <!-- Conteúdo quando logado -->
  <div id="drawer-logado" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
    <div class="nota-atual">
      <label id="nota-label">Anotação — Pág. ?</label>
      <textarea id="nota-texto" placeholder="Escreva sua anotação para esta página..."></textarea>
      <div class="nota-atual-btns">
        <span class="salvo-msg" id="salvo-msg">✓ Salvo</span>
        <button class="btn-apagar" onclick="apagarNota()">🗑 Apagar</button>
        <button class="btn-salvar" id="btn-salvar" onclick="salvarNota()">Salvar</button>
      </div>
    </div>
    <div class="notas-lista">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <h4 style="margin:0;">Todas as anotações</h4>
        <button class="btn-exportar-todas" onclick="exportarTodas()" title="Exportar todas como .txt">⬇ Exportar todas</button>
      </div>
      <div id="lista-notas"></div>
    </div>
  </div>

    <!-- Aba highlights -->
    <div id="drawer-marcacoes" style="display:none;flex:1;overflow-y:auto;padding:14px 18px;">
      <h4 style="font-size:12px;color:#666;margin:0 0 12px;text-transform:uppercase;">Destaques</h4>
      <div id="lista-marcacoes"></div>
    </div>
  </div>

  <!-- Conteúdo quando não logado -->
  <div id="drawer-sem-login" class="sem-login" style="display:none;">
    <p>Para fazer anotações e marcações, você precisa estar logado.</p>
    <a href="login.html">Fazer login →</a>
  </div>
</div>

<!-- ── Modal de exportação ── -->
<div id="modal-exportar" onclick="fecharModalExpOverlay(event)">
  <div class="modal-exp">
    <h3 id="modal-exp-titulo">Exportar anotação</h3>
    <p id="modal-exp-sub"></p>
    <textarea id="modal-exp-texto" readonly></textarea>
    <div class="modal-exp-btns">
      <button class="btn-fechar-exp" onclick="fecharModalExp()">Fechar</button>
      <button class="btn-dl-txt" onclick="baixarTxt()">⬇ Baixar .txt</button>
    </div>
  </div>
</div>

<script>
  const API    = "https://edischinho-github-io.onrender.com"
  const params = new URLSearchParams(window.location.search)

  // Token da sessão — preenchido no init()
  let _accessToken = ""

  function jwtHeader() {
    return _accessToken
      ? { "Authorization": "Bearer " + _accessToken }
      : {}
  }
  const pdfUrl        = params.get("pdf")
  const pdfUrlDecoded = pdfUrl ? decodeURIComponent(pdfUrl) : ""
  const viewer = document.getElementById("viewer")
  let pdfDoc   = null

  // ── Sessão — lida do Supabase SDK ──
  let userId   = null
  let username = null
  let logado   = false

  // Anotações: { pagina: texto }
  let anotacoes      = {}
  let paginaNoDrawer = 1

  // Inicializa sessão e então carrega tudo
  async function init() {
    // 1. Resolver sessão PRIMEIRO — logado/userId ficam disponíveis para tudo abaixo
    const { data } = await _supa.auth.getSession()
    if (data.session) {
      userId        = data.session.user.id
      username      = data.session.user.user_metadata?.username
                   || data.session.user.email.split("@")[0]
      logado        = true
      _accessToken  = data.session.access_token
      localStorage.setItem("sl_role",     "user")
      localStorage.setItem("sl_username", username)
    }

    if (!pdfUrl) {
      mostrarErro("Nenhum arquivo especificado.")
      return
    }

    // 2. Carregar PDF (não depende de sessão)
    carregarPDF(decodeURIComponent(pdfUrl))

    // 3. Carregar anotações e marcações APÓS sessão resolvida (await garante ordem)
    await carregarAnotacoes()
    await carregarMarcacoes()
  }

  init()

  // ── Carregar PDF ──
  function carregarPDF(url) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"

    pdfjsLib.getDocument(url).promise
      .then(pdf => {
        pdfDoc = pdf
        document.getElementById("pagina-info").textContent = `Pág. 1 / ${pdf.numPages}`
        document.getElementById("input-pagina").max = pdf.numPages

        for (let i = 1; i <= pdf.numPages; i++) {
          const pageDiv = document.createElement("div")
          pageDiv.className  = "page"
          pageDiv.dataset.page = i
          const placeholder = document.createElement("div")
          placeholder.className = "placeholder"
          pageDiv.appendChild(placeholder)
          viewer.appendChild(pageDiv)
          observer.observe(pageDiv)
        }

        // Restaurar última página lida
        const chave      = "sl_pagina_" + hashUrl(pdfUrl)
        const localPag   = parseInt(localStorage.getItem(chave)) || 0

        async function restaurarProgresso() {
          let pagFinal = localPag

          // Se logado, busca do Supabase (pode ser mais recente que o local)
          if (logado && userId) {
            try {
              const headers = jwtHeader()
              const res  = await fetch(`${API}/progresso?livro_url=${encodeURIComponent(pdfUrlDecoded)}`, { headers })
              const data = await res.json()
              if (data && data.pagina > pagFinal) pagFinal = data.pagina
            } catch {}
          }

          if (pagFinal > 1 && pagFinal <= pdf.numPages) {
            setTimeout(() => {
              document.getElementById("input-pagina").value = pagFinal
              irParaPagina()
            }, 200)
          }
        }

        restaurarProgresso()
      })
      .catch(err => mostrarErro("Erro ao carregar o PDF: " + err.message))
  }

  // ── Página atual ──
  function paginaVisivel() {
    const pages   = viewer.querySelectorAll(".page")
    const alturaVP = window.innerHeight
    let max = 0, atual = 1
    pages.forEach(p => {
      const r = p.getBoundingClientRect()
      const vis = Math.max(Math.min(r.bottom, alturaVP) - Math.max(r.top, 0), 0)
      if (vis > max) { max = vis; atual = parseInt(p.dataset.page) }
    })
    return atual
  }

  function atualizarPaginaAtual() {
    if (!pdfDoc) return
    const num = paginaVisivel()
    document.getElementById("pagina-info").textContent = `Pág. ${num} / ${pdfDoc.numPages}`
    // Sincroniza drawer se estiver aberto
    if (document.getElementById("drawer").classList.contains("aberto")) {
      abrirDrawerNaPagina(num)
    }
  }

  let navegando = false, scrollTimer = null
  let _ultimaPaginaSalva = 0
  let _saveTimer = null

  window.addEventListener("scroll", () => {
    if (navegando) return
    if (scrollTimer) return
    scrollTimer = setTimeout(() => {
      atualizarPaginaAtual()
      salvarProgresso()
      scrollTimer = null
    }, 80)
  }, { passive: true })

  // Salva ao sair/fechar aba
  window.addEventListener("beforeunload", () => salvarProgresso(true))

  // ── Salvar progresso ──
  function salvarProgresso(forcar = false) {
    if (!pdfDoc || !pdfUrl) return
    const pag = paginaVisivel()
    if (pag === _ultimaPaginaSalva && !forcar) return
    _ultimaPaginaSalva = pag

    // Sempre salva no localStorage (instantâneo, funciona offline)
    const chave = "sl_pagina_" + hashUrl(pdfUrl)
    localStorage.setItem(chave, pag)

    // Sincroniza com backend (JWT) se logado
    if (logado && userId) {
      if (_saveTimer) clearTimeout(_saveTimer)
      _saveTimer = setTimeout(async () => {
        try {
          const headers = jwtHeader()
          await fetch(`${API}/progresso`, {
            method: "POST",
            headers: { "Content-Type": "application/json", ...headers },
            body: JSON.stringify({ livro_url: pdfUrlDecoded, pagina: pag })
          })
        } catch {}
      }, 1000)
    }
  }

  // ── Lazy loading ──
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const pageDiv   = entry.target
        const pageIndex = [...viewer.children].indexOf(pageDiv) + 1
        renderPage(pageIndex, pageDiv)
        observer.unobserve(pageDiv)
      }
    })
  }, { rootMargin: "300px" })

  function renderPage(num, container) {
    pdfDoc.getPage(num).then(page => {
      const scale    = window.innerWidth < 600 ? 1.0 : 1.5
      const viewport = page.getViewport({ scale })

      // Wrapper relativo — empilha canvas PDF + canvas de desenho
      const wrap = document.createElement("div")
      wrap.style.cssText = "position:relative;width:100%;display:block;line-height:0;"

      // Canvas do PDF
      const pdfCanvas = document.createElement("canvas")
      const ctx       = pdfCanvas.getContext("2d")
      pdfCanvas.height = viewport.height
      pdfCanvas.width  = viewport.width
      pdfCanvas.className = "pdf-canvas"
      wrap.appendChild(pdfCanvas)

      container.innerHTML = ""
      container.appendChild(wrap)

      // Após inserir no DOM, wrap tem tamanho real — montar draw-canvas
      requestAnimationFrame(() => {
        const dc = document.createElement("canvas")
        dc.className   = "draw-canvas"
        dc.width       = viewport.width
        dc.height      = viewport.height
        dc.dataset.pag = num
        wrap.appendChild(dc)

        restaurarDesenho(num, dc)
        iniciarDesenho(dc, num)
        if (logado) atualizarBadge(num, container)
      })

      // Renderizar PDF
      page.render({ canvasContext: ctx, viewport })

      // Restaurar marcações salvas neste canvas
      restaurarDesenho(num, dc)

      // Eventos de desenho
      iniciarDesenho(dc, num)

      // Badge de anotação
      if (logado) atualizarBadge(num, container)
    })
  }

  // ── Ir para página ──
  let animacaoScroll = null
  function irParaPagina() {
    if (!pdfDoc) return
    const input = document.getElementById("input-pagina")
    let num = parseInt(input.value)
    if (isNaN(num) || num < 1) num = 1
    if (num > pdfDoc.numPages)  num = pdfDoc.numPages
    input.value = num

    const alvo = viewer.querySelector(`.page[data-page="${num}"]`)
    if (!alvo) return

    navegando = true
    document.getElementById("pagina-info").textContent = `Pág. ${num} / ${pdfDoc.numPages}`

    for (let v = Math.max(1, num - 2); v <= Math.min(pdfDoc.numPages, num + 2); v++) {
      const viz = viewer.querySelector(`.page[data-page="${v}"]`)
      if (viz && viz.querySelector(".placeholder")) { renderPage(v, viz); observer.unobserve(viz) }
    }

    viewer.style.transition = "opacity 0.15s ease"
    viewer.style.opacity    = "0"

    setTimeout(() => {
      const topoAlvo = alvo.getBoundingClientRect().top + window.scrollY - 60
      window.scrollTo(0, topoAlvo)
      requestAnimationFrame(() => {
        const topoFinal = alvo.getBoundingClientRect().top + window.scrollY - 60
        window.scrollTo(0, topoFinal)
        viewer.style.opacity = "1"
        setTimeout(() => {
          viewer.style.transition = ""
          navegando = false
          document.getElementById("pagina-info").textContent = `Pág. ${num} / ${pdfDoc.numPages}`
          destacar(alvo)
          if (document.getElementById("drawer").classList.contains("aberto")) abrirDrawerNaPagina(num)
        }, 150)
      })
    }, 150)
  }

  function destacar(el) {
    el.classList.add("destaque")
    setTimeout(() => el.classList.remove("destaque"), 1800)
  }

  document.getElementById("input-pagina").addEventListener("keydown", e => {
    if (e.key === "Enter") irParaPagina()
  })

  // ── Download ──
  async function baixarPDF() {
    const url = decodeURIComponent(pdfUrl)
    try {
      const res  = await fetch(url)
      const blob = await res.blob()
      const a    = document.createElement("a")
      a.href     = URL.createObjectURL(blob)
      a.download = url.split("/").pop().replace(/^\d+-/, "") || "livro.pdf"
      a.click()
      URL.revokeObjectURL(a.href)
    } catch { window.open(url, "_blank") }
  }

  // ─────────────────────────────────────────────
  // ── ANOTAÇÕES — Supabase (logado) ou localStorage (offline) ──
  // ─────────────────────────────────────────────

  // Hash simples mas único — soma dos char codes da URL decodificada completa
  function hashUrl(url) {
    const s = decodeURIComponent(url)
    let h = 0
    for (let i = 0; i < s.length; i++) {
      h = (Math.imul(31, h) + s.charCodeAt(i)) | 0
    }
    return (h >>> 0).toString(36)  // unsigned, base36
  }

  function chaveLocal()  { return "sl_notas_" + hashUrl(pdfUrl) }

  // ── Carrega: backend (JWT) se logado, localStorage se não ──
  async function carregarAnotacoes() {
    if (logado && userId) {
      try {
        const headers = jwtHeader()
        const res  = await fetch(`${API}/anotacoes?livro_url=${encodeURIComponent(pdfUrlDecoded)}`, { headers })
        if (!res.ok) throw new Error()
        anotacoes = await res.json()
        localStorage.setItem(chaveLocal(), JSON.stringify(anotacoes))
      } catch {
        try { anotacoes = JSON.parse(localStorage.getItem(chaveLocal()) || "{}") }
        catch { anotacoes = {} }
      }
    } else {
      try { anotacoes = JSON.parse(localStorage.getItem(chaveLocal()) || "{}") }
      catch { anotacoes = {} }
    }

    viewer.querySelectorAll(".page").forEach(p => {
      atualizarBadge(parseInt(p.dataset.page), p)
    })
    renderizarListaNotas()
  }

  // ── Persiste: Supabase + localStorage (sempre os dois) ──
  async function persistirAnotacoes() {
    // localStorage sempre — garante cache offline
    try { localStorage.setItem(chaveLocal(), JSON.stringify(anotacoes)) }
    catch {}

    // Supabase só se logado
    if (!logado || !userId) return

    // Envia em paralelo todas as anotações modificadas
    // Estratégia: reenvia o estado inteiro da página que mudou (última salva)
    // (a rota já faz upsert, então é idempotente)
  }

  // Badge amarelo embaixo da página
  function atualizarBadge(num, container) {
    const existente = container.querySelector(".nota-badge")
    if (existente) existente.remove()

    if (anotacoes[num]) {
      const badge = document.createElement("div")
      badge.className   = "nota-badge"
      badge.textContent = "📝 Anotação"
      badge.onclick     = () => { abrirDrawerNaPagina(num); abrirDrawer() }
      container.appendChild(badge)
    }
  }

  // ── Drawer ──
  function toggleDrawer() {
    const drawer = document.getElementById("drawer")
    if (drawer.classList.contains("aberto")) {
      fecharDrawer()
    } else {
      abrirDrawer()
    }
  }

  function abrirDrawer() {
    const drawer  = document.getElementById("drawer")
    const overlay = document.getElementById("overlay")
    const btn     = document.getElementById("btn-notas")

    drawer.classList.add("aberto")
    overlay.classList.add("visivel")
    btn.classList.add("ativo")

    // Anotações sempre disponíveis — não exigem login
    document.getElementById("drawer-logado").style.display    = "flex"
    document.getElementById("drawer-sem-login").style.display = "none"
    abrirDrawerNaPagina(paginaVisivel())
  }

  function fecharDrawer() {
    document.getElementById("drawer").classList.remove("aberto")
    document.getElementById("overlay").classList.remove("visivel")
    document.getElementById("btn-notas").classList.remove("ativo")
  }

  // Sincroniza o textarea com a página indicada
  function abrirDrawerNaPagina(num) {
    paginaNoDrawer = num
    document.getElementById("nota-label").textContent  = `Anotação — Pág. ${num}`
    document.getElementById("nota-texto").value        = anotacoes[num] || ""
    document.getElementById("salvo-msg").classList.remove("visivel")
  }

  // ── Salvar — localStorage imediato + Supabase em background ──
  async function salvarNota() {
    const texto = document.getElementById("nota-texto").value.trim()
    const btn   = document.getElementById("btn-salvar")
    btn.disabled = true; btn.textContent = "Salvando..."

    // 1. Atualiza estado local
    if (texto) {
      anotacoes[paginaNoDrawer] = texto
    } else {
      delete anotacoes[paginaNoDrawer]
    }

    // 2. Grava no localStorage imediatamente (resposta instantânea)
    try { localStorage.setItem(chaveLocal(), JSON.stringify(anotacoes)) } catch {}

    // 3. Sincroniza com backend (JWT) em background se logado
    if (logado && userId) {
      try {
        const headers = jwtHeader()
        await fetch(`${API}/anotacoes`, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...headers },
          body: JSON.stringify({ livro_url: pdfUrlDecoded, pagina: paginaNoDrawer, texto })
        })
      } catch {
        console.warn("Backend offline, anotação salva só localmente.")
      }
    }

    // 4. Atualiza UI
    const pageDiv = viewer.querySelector(`.page[data-page="${paginaNoDrawer}"]`)
    if (pageDiv) atualizarBadge(paginaNoDrawer, pageDiv)
    renderizarListaNotas()

    const msg = document.getElementById("salvo-msg")
    msg.classList.add("visivel")
    setTimeout(() => msg.classList.remove("visivel"), 2000)

    btn.disabled = false; btn.textContent = "Salvar"
  }

  // ── Apagar ──
  async function apagarNota() {
    document.getElementById("nota-texto").value = ""
    await salvarNota()
  }

  // ── Lista lateral ──
  function renderizarListaNotas() {
    const lista  = document.getElementById("lista-notas")
    const paginas = Object.keys(anotacoes).map(Number).sort((a, b) => a - b)

    if (!paginas.length) {
      lista.innerHTML = '<p class="notas-vazia">Nenhuma anotação ainda.</p>'
      return
    }

    lista.innerHTML = paginas.map(p => `
      <div class="nota-item" style="display:flex;align-items:flex-start;gap:6px;">
        <div style="flex:1;cursor:pointer;" onclick="irParaNota(${p})">
          <div class="nota-item-pag">Página ${p}</div>
          <div class="nota-item-texto">${escapeHtml(anotacoes[p])}</div>
        </div>
        <button class="nota-item-exportar" onclick="exportarUma(${p})" title="Exportar esta anotação">⬇</button>
      </div>
    `).join("")
  }

  function irParaNota(num) {
    abrirDrawerNaPagina(num)
    // Navega para a página sem fechar o drawer
    document.getElementById("input-pagina").value = num
    irParaPagina()
  }

  // ─────────────────────────────────────────────
  // ── EXPORTAÇÃO ──
  // ─────────────────────────────────────────────

  let expTextoAtual  = ""
  let expNomeArquivo = "anotacao.txt"

  // Nome limpo do livro para o arquivo
  function nomeDoLivro() {
    try {
      const url  = decodeURIComponent(pdfUrl)
      const base = url.split("/").pop().replace(/^\d+-/, "").replace(/\.pdf$/i, "")
      return base.replace(/_/g, " ") || "livro"
    } catch { return "livro" }
  }

  // Exportar anotação de uma página específica
  function exportarUma(pagina) {
    const texto = anotacoes[pagina]
    if (!texto) return

    const livro   = nomeDoLivro()
    const conteudo = [
      `Stronghold Library — Anotações`,
      `Livro : ${livro}`,
      `Página: ${pagina}`,
      ``,
      texto
    ].join("\n")

    expTextoAtual  = conteudo
    expNomeArquivo = `${livro}_pag${pagina}.txt`

    document.getElementById("modal-exp-titulo").textContent = `Exportar — Pág. ${pagina}`
    document.getElementById("modal-exp-sub").textContent    = `Anotação da página ${pagina} de "${livro}"`
    document.getElementById("modal-exp-texto").value        = conteudo
    document.getElementById("modal-exportar").classList.add("aberto")
  }

  // Exportar todas as anotações de uma vez
  function exportarTodas() {
    const paginas = Object.keys(anotacoes).map(Number).sort((a, b) => a - b)
    if (!paginas.length) { alert("Nenhuma anotação para exportar."); return }

    const livro = nomeDoLivro()
    const linhas = [
      `Stronghold Library — Anotações`,
      `Livro : ${livro}`,
      `Total : ${paginas.length} anotação${paginas.length > 1 ? "ões" : ""}`,
      ``,
      `${"─".repeat(50)}`
    ]

    paginas.forEach(p => {
      linhas.push(``, `[ Página ${p} ]`, ``, anotacoes[p], `${"─".repeat(50)}`)
    })

    expTextoAtual  = linhas.join("\n")
    expNomeArquivo = `${livro}_anotacoes.txt`

    document.getElementById("modal-exp-titulo").textContent = `Exportar todas (${paginas.length})`
    document.getElementById("modal-exp-sub").textContent    = `${paginas.length} anotaç${paginas.length > 1 ? "ões" : "ão"} de "${livro}"`
    document.getElementById("modal-exp-texto").value        = expTextoAtual
    document.getElementById("modal-exportar").classList.add("aberto")
  }

  function baixarTxt() {
    const blob = new Blob([expTextoAtual], { type: "text/plain;charset=utf-8" })
    const a    = document.createElement("a")
    a.href     = URL.createObjectURL(blob)
    a.download = expNomeArquivo
    a.click()
    URL.revokeObjectURL(a.href)
  }

  function fecharModalExp() {
    document.getElementById("modal-exportar").classList.remove("aberto")
  }

  // Fechar ao clicar no fundo escuro (fora do card)
  function fecharModalExpOverlay(e) {
    if (e.target === document.getElementById("modal-exportar")) fecharModalExp()
  }

  // Fechar modal com Escape
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") fecharModalExp()
  })

  // ─────────────────────────────────────────────
  // ── MARCAÇÕES COM MARCA-TEXTO (canvas livre) ──
  // ─────────────────────────────────────────────

  // Estrutura: { id: { pagina, cor, nota, imgData } }
  // imgData = dataURL do canvas de desenho da página inteira
  let highlights     = {}
  let corSelecionada = "#facc15"
  let modoHL         = false
  let _desenhandoId  = null   // id do highlight em andamento (traço atual)
  let _popoverHlId   = null

  function chaveHL()   { return "sl_hl_"    + hashUrl(pdfUrl) }

  // ── Carregar marcações ──
  async function carregarMarcacoes() {
    try { highlights = JSON.parse(localStorage.getItem(chaveHL()) || "{}") } catch { highlights = {} }

    if (logado && userId) {
      try {
        const headers = jwtHeader()
        const res  = await fetch(`${API}/highlights?livro_url=${encodeURIComponent(pdfUrlDecoded)}`, { headers })
        const data = await res.json()
        if (Array.isArray(data) && data.length) {
          data.forEach(h => {
            highlights[h.hl_id] = { pagina: h.pagina, cor: h.cor, nota: h.nota || "", imgData: h.img_data || "" }
          })
          localStorage.setItem(chaveHL(), JSON.stringify(highlights))
        }
      } catch {}
    }

    // Restaurar canvas de páginas já renderizadas
    viewer.querySelectorAll(".draw-canvas").forEach(dc => {
      restaurarDesenho(parseInt(dc.dataset.pag), dc)
    })
    renderizarListaMarcacoes()
  }

  // ── Restaurar desenho salvo num canvas ──
  function restaurarDesenho(num, dc) {
    const ctx = dc.getContext("2d")
    ctx.clearRect(0, 0, dc.width, dc.height)
    // Pode haver múltiplos highlights na mesma página — renderizar todos
    Object.values(highlights).forEach(h => {
      if (h.pagina === num && h.imgData) {
        const img = new Image()
        img.onload = () => ctx.drawImage(img, 0, 0)
        img.src = h.imgData
      }
    })
  }

  // ── Persistir highlight ──
  async function persistirHL(id) {
    try { localStorage.setItem(chaveHL(), JSON.stringify(highlights)) } catch {}
    if (!logado || !userId) return
    const h = highlights[id]
    if (!h) return
    try {
      const headers = jwtHeader()
      await fetch(`${API}/highlights`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...headers },
        body: JSON.stringify({ hl_id: id, livro_url: pdfUrlDecoded, pagina: h.pagina, cor: h.cor, nota: h.nota, img_data: h.imgData })
      })
    } catch {}
  }

  async function deletarHL(id) {
    const h = highlights[id]
    delete highlights[id]
    try { localStorage.setItem(chaveHL(), JSON.stringify(highlights)) } catch {}
    if (logado && userId) {
      try {
        const headers = jwtHeader()
        await fetch(`${API}/highlights/${encodeURIComponent(id)}`, { method: "DELETE", headers })
      } catch {}
    }
    // Redesenhar canvas da página (sem o highlight deletado)
    if (h) {
      const dc = viewer.querySelector(`.draw-canvas[data-pag="${h.pagina}"]`)
      if (dc) restaurarDesenho(h.pagina, dc)
    }
    renderizarListaMarcacoes()
  }

  // ── Iniciar eventos de desenho num canvas ──
  function iniciarDesenho(dc, num) {
    let desenhando = false
    let tracos     = []

    // Canvas temporário — recebe o traço atual com opacidade 1
    // Só é composto no draw-canvas ao terminar, com alpha fixo
    const tmp    = document.createElement("canvas")
    tmp.width    = dc.width
    tmp.height   = dc.height
    const tmpCtx = tmp.getContext("2d")

    function ptRelativo(e) {
      const r   = dc.getBoundingClientRect()
      const src = e.touches ? e.touches[0] : e
      return {
        x: (src.clientX - r.left) * (dc.width  / r.width),
        y: (src.clientY - r.top)  * (dc.height / r.height)
      }
    }

    function iniciar(e) {
      if (!modoHL || corSelecionada === "") return
      e.preventDefault()
      desenhando = true
      tracos = []
      tmpCtx.clearRect(0, 0, tmp.width, tmp.height)
      tracos.push(ptRelativo(e))
    }

    function mover(e) {
      if (!desenhando || !modoHL) return
      e.preventDefault()
      const pt   = ptRelativo(e)
      const prev = tracos[tracos.length - 1]

      // Desenhar no canvas temporário com opacidade 1
      // O traço completo terá transparência uniforme ao ser composto
      tmpCtx.globalCompositeOperation = "source-over"
      tmpCtx.strokeStyle = corSelecionada
      tmpCtx.lineWidth   = 20
      tmpCtx.lineCap     = "round"
      tmpCtx.lineJoin    = "round"
      tmpCtx.globalAlpha = 1
      tmpCtx.beginPath()
      tmpCtx.moveTo(prev.x, prev.y)
      tmpCtx.lineTo(pt.x, pt.y)
      tmpCtx.stroke()

      tracos.push(pt)

      // Prévia em tempo real: redesenha o draw-canvas com o tmp sobreposto
      // Limpa só a área de previsualização, não apaga marcações anteriores
      const ctx = dc.getContext("2d")
      // Salvar snapshot atual sem o traço em andamento
      if (!dc._snapshot) {
        dc._snapshot = document.createElement("canvas")
        dc._snapshot.width  = dc.width
        dc._snapshot.height = dc.height
        dc._snapshot.getContext("2d").drawImage(dc, 0, 0)
      }
      ctx.clearRect(0, 0, dc.width, dc.height)
      ctx.drawImage(dc._snapshot, 0, 0)
      // Compor traço atual com alpha fixo de 35%
      ctx.globalAlpha = 0.35
      ctx.globalCompositeOperation = "source-over"
      ctx.drawImage(tmp, 0, 0)
      ctx.globalAlpha = 1
      ctx.globalCompositeOperation = "source-over"
    }

    function terminar(e) {
      if (!desenhando || !modoHL) return
      desenhando = false
      dc._snapshot = null   // limpar snapshot

      if (tracos.length < 2) return

      // Compor traço final no draw-canvas com alpha fixo — não acumula
      const ctx = dc.getContext("2d")
      ctx.globalAlpha = 0.35
      ctx.globalCompositeOperation = "source-over"
      ctx.drawImage(tmp, 0, 0)
      ctx.globalAlpha = 1
      ctx.globalCompositeOperation = "source-over"
      tmpCtx.clearRect(0, 0, tmp.width, tmp.height)

      const id      = "hl_" + num + "_" + Date.now()
      const imgData = dc.toDataURL("image/png")
      highlights[id] = { pagina: num, cor: corSelecionada, nota: "", imgData }
      persistirHL(id)
      renderizarListaMarcacoes()
      tracos = []
    }

    dc.addEventListener("mousedown",  iniciar,   { passive: false })
    dc.addEventListener("mousemove",  mover,     { passive: false })
    dc.addEventListener("mouseup",    terminar)
    dc.addEventListener("mouseleave", terminar)
    dc.addEventListener("touchstart", iniciar,   { passive: false })
    dc.addEventListener("touchmove",  mover,     { passive: false })
    dc.addEventListener("touchend",   terminar)

    // Clique simples sem arrastar = abrir popover do último highlight desta página
    dc.addEventListener("click", (e) => {
      if (!modoHL || corSelecionada !== "") return
      // Modo apagar: mostrar popover para deletar
      const hlsPagina = Object.entries(highlights).filter(([,h]) => h.pagina === num)
      if (!hlsPagina.length) return
      // Pega o mais recente
      const [id] = hlsPagina[hlsPagina.length - 1]
      abrirPopover(e, id)
    })
  }

  // ── Popover ──
  function abrirPopover(e, id) {
    _popoverHlId = id
    const h   = highlights[id]
    if (!h) return
    const pop = document.getElementById("hl-popover")
    document.getElementById("hl-pop-cor").style.background = h.cor
    document.getElementById("hl-pop-pag").textContent      = `Página ${h.pagina}`
    const notaEl = document.getElementById("hl-pop-nota")
    if (h.nota && h.nota.trim()) {
      notaEl.className   = "hl-pop-texto"
      notaEl.textContent = h.nota.length > 120 ? h.nota.slice(0,120) + "…" : h.nota
    } else {
      notaEl.className   = "hl-pop-vazia"
      notaEl.textContent = "Sem nota vinculada. Clique em 'Ver nota'."
    }
    const x = e.touches ? e.touches[0].clientX : e.clientX
    const y = e.touches ? e.touches[0].clientY : e.clientY
    pop.style.left = Math.min(x + 8, window.innerWidth  - 300) + "px"
    pop.style.top  = Math.min(y + 8, window.innerHeight - 180) + "px"
    pop.classList.add("visivel")
    setTimeout(() => {
      document.addEventListener("click",      fecharPopoverFora, { once: true })
      document.addEventListener("touchstart", fecharPopoverFora, { once: true })
    }, 10)
  }

  function fecharPopoverFora(e) {
    const pop = document.getElementById("hl-popover")
    if (!pop.contains(e.target)) pop.classList.remove("visivel")
  }

  window.abrirNotaDoHL = function() {
    if (!_popoverHlId) return
    const h = highlights[_popoverHlId]
    if (!h) return
    document.getElementById("hl-popover").classList.remove("visivel")
    abrirDrawer()
    trocarAbaDrawer("notas")
    abrirDrawerNaPagina(h.pagina)
    if (h.nota) document.getElementById("nota-texto").value = h.nota
    window._hlVinculadoId = _popoverHlId
  }

  window.deletarHLAtual = async function() {
    if (!_popoverHlId) return
    document.getElementById("hl-popover").classList.remove("visivel")
    await deletarHL(_popoverHlId)
  }

  // ── Toggle modo destaque ──
  function toggleModoHL() {
    modoHL = !modoHL
    const btn  = document.getElementById("btn-hl")
    const wrap = document.getElementById("cores-wrap")
    btn.classList.toggle("ativo", modoHL)
    wrap.style.display = modoHL ? "flex" : "none"
    viewer.querySelectorAll(".page").forEach(p => p.classList.toggle("modoHL", modoHL))
    if (modoHL) {
      const first = document.querySelector(".cor-btn[data-cor='#facc15']")
      if (first) selecionarCor(first, "#facc15")
    }
  }

  function selecionarCor(el, cor) {
    corSelecionada = cor
    document.querySelectorAll(".cor-btn").forEach(b => b.classList.remove("ativa"))
    el.classList.add("ativa")
  }

  // ── Lista no drawer ──
  function renderizarListaMarcacoes() {
    const lista = document.getElementById("lista-marcacoes")
    if (!lista) return
    const itens = Object.entries(highlights)
      .filter(([,h]) => h && h.pagina)
      .sort((a,b) => a[1].pagina - b[1].pagina)

    if (!itens.length) {
      lista.innerHTML = '<p class="notas-vazia">Nenhum destaque ainda.<br>Ative 🖍 Destacar e pinte sobre o texto.</p>'
      return
    }
    lista.innerHTML = itens.map(([id, h]) => `
      <div class="hl-item" onclick="irParaHL('${id}')">
        <div class="hl-item-cor" style="background:${h.cor}"></div>
        <div class="hl-item-info">
          <div class="hl-item-pag">Página ${h.pagina}</div>
          <div class="hl-item-nota">${escapeHtml(h.nota || "(sem nota)")}</div>
        </div>
        <button onclick="event.stopPropagation();deletarHL('${id}')"
          style="background:none;border:none;color:#666;cursor:pointer;font-size:14px;flex-shrink:0;" title="Remover">✕</button>
      </div>
    `).join("")
  }

  function irParaHL(id) {
    const h = highlights[id]
    if (!h) return
    document.getElementById("input-pagina").value = h.pagina
    irParaPagina()
  }

  // Ao salvar nota, vincula ao highlight se houver
  const _salvarNotaOrig = salvarNota
  async function salvarNota() {
    await _salvarNotaOrig()
    if (window._hlVinculadoId && highlights[window._hlVinculadoId]) {
      highlights[window._hlVinculadoId].nota = document.getElementById("nota-texto").value.trim()
      await persistirHL(window._hlVinculadoId)
      window._hlVinculadoId = null
      renderizarListaMarcacoes()
    }
  }
  // ── Trocar aba do drawer ──
  function trocarAbaDrawer(aba) {
    const elNotas     = document.getElementById("drawer-logado")
    const elMarcacoes = document.getElementById("drawer-marcacoes")
    const tabNotas    = document.getElementById("tab-notas")
    const tabMarc     = document.getElementById("tab-marcacoes")

    if (aba === "notas") {
      elNotas.style.display     = "flex"
      elMarcacoes.style.display = "none"
      tabNotas.style.background = "#ffd700"; tabNotas.style.color = "#111"
      tabMarc.style.background  = "#333";    tabMarc.style.color  = "#ccc"
    } else {
      elNotas.style.display     = "none"
      elMarcacoes.style.display = "block"
      tabMarc.style.background  = "#ffd700"; tabMarc.style.color = "#111"
      tabNotas.style.background = "#333";    tabNotas.style.color = "#ccc"
    }
  }

  function escapeHtml(t) {
    return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  }

  // Salvar com Ctrl+Enter no textarea
  document.getElementById("nota-texto").addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); salvarNota() }
  })

  // ── Erro ──
  function mostrarErro(msg) {
    viewer.style.display = "none"
    const el = document.getElementById("erro")
    el.textContent = msg; el.style.display = "block"
  }
</script>

<script>
(function() {
  const wrap     = document.getElementById("btn-conta-wrap")
  const btnStyle = "background:#222;color:#eee;border:none;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;"

  // Lê sessão do Supabase SDK para decidir o que mostrar
  _supa.auth.getSession().then(({ data }) => {
    const session  = data.session
    const role     = localStorage.getItem("sl_role")  // admin não tem sessão Supabase
    const isAdmin  = role === "admin"
    const uname    = session
      ? (session.user.user_metadata?.username || session.user.email.split("@")[0])
      : (isAdmin ? "admin" : null)
    const logado   = !!(session || isAdmin)

    if (logado) {
      wrap.innerHTML = `
        <button id="conta-btn" style="${btnStyle}display:flex;align-items:center;gap:6px;">
          👤 ${uname || "Conta"} ▾
        </button>
        <div id="conta-menu" style="display:none;position:absolute;right:0;top:110%;background:#222;border:1px solid #444;border-radius:8px;min-width:150px;box-shadow:0 4px 16px rgba(0,0,0,0.6);z-index:100;">
          <div style="padding:10px 14px;font-size:12px;color:#888;border-bottom:1px solid #333;">${uname}</div>
          <button onclick="sairConta()" style="width:100%;text-align:left;background:none;border:none;color:#f88;padding:10px 14px;font-size:13px;cursor:pointer;">🚪 Sair</button>
        </div>`
      document.getElementById("conta-btn").addEventListener("click", (e) => {
        e.stopPropagation()
        const m = document.getElementById("conta-menu")
        m.style.display = m.style.display === "none" ? "block" : "none"
      })
      document.addEventListener("click", () => {
        const m = document.getElementById("conta-menu")
        if (m) m.style.display = "none"
      })
    } else {
      wrap.innerHTML = `<button onclick="location.href='login.html'" style="${btnStyle}background:#fff;color:#111;font-weight:bold;">Entrar</button>`
    }
  })

  async function sairConta() {
    await _supa.auth.signOut()
    ;["sl_role","sl_username"].forEach(k => localStorage.removeItem(k))
    location.href = "index.html"
  }
  window.sairConta = sairConta
})()
</script>
