<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leitor</title>

<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
text-align:center;
}

iframe{
width:100%;
height:95vh;
border:none;
}

.topo{
padding:10px;
background:#000;
}

a{
color:white;
text-decoration:none;
font-size:14px;
}

</style>

</head>

<body>

<div class="topo">
<a id="download" target="_blank">Abrir em nova aba</a>
</div>

<iframe id="pdf"></iframe>

<script>

let params = new URLSearchParams(window.location.search)

let pdf = params.get("pdf")

let url = "https://edischinho-github-io.onrender.com/"+pdf

document.getElementById("pdf").src = url

document.getElementById("download").href = url

</script>

</body>

</html>
