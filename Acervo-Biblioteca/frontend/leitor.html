<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor</title>
<style>
body{margin:0;background:#111;font-family:Arial;}
.topo{position:sticky;top:0;background:#000;color:white;padding:10px;text-align:center;z-index:10;}
#viewer{max-width:900px;margin:auto;padding:10px;}
.page{margin-bottom:20px;display:flex;justify-content:center;}
canvas{width:100%;background:white;border-radius:5px;box-shadow:0 0 8px rgba(0,0,0,0.6);}
.placeholder{width:100%;height:900px;background:#222;border-radius:5px;}
</style>
</head>
<body>
<div class="topo">Leitor Stronghold Library</div>
<div id="viewer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
let params=new URLSearchParams(window.location.search)
let pdfFile=params.get("pdf")
let url="https://SEU_BACKEND_RENDER/uploads/"+pdfFile
let viewer=document.getElementById("viewer")
let pdfDoc=null

const observer = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      let pageDiv=entry.target
      let pageIndex=[...viewer.children].indexOf(pageDiv)+1
      renderPage(pageIndex,pageDiv)
      observer.unobserve(pageDiv)
    }
  })
},{rootMargin:"300px"})

pdfjsLib.getDocument(url).promise.then(pdf=>{
  pdfDoc=pdf
  for(let i=1;i<=pdf.numPages;i++){
    let pageDiv=document.createElement("div")
    pageDiv.className="page"
    let placeholder=document.createElement("div")
    placeholder.className="placeholder"
    pageDiv.appendChild(placeholder)
    viewer.appendChild(pageDiv)
    observer.observe(pageDiv)
  }
})

function renderPage(num,container){
  pdfDoc.getPage(num).then(page=>{
    let scale=1.5
    let viewport=page.getViewport({scale:scale})
    let canvas=document.createElement("canvas")
    let context=canvas.getContext("2d")
    canvas.height=viewport.height
    canvas.width=viewport.width
    container.innerHTML=""
    container.appendChild(canvas)
    page.render({canvasContext:context,viewport:viewport})
  })
}
</script>
</body>
</html>
