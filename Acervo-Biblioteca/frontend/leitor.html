<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor — Stronghold Library</title>
  <style>
    body { margin: 0; background: #111; font-family: Arial, sans-serif; color: white; }

    /* ── Barra superior ── */
    .topo {
      position: sticky; top: 0; background: #000;
      padding: 10px 16px; display: flex; align-items: center;
      gap: 10px; z-index: 20; box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      flex-wrap: wrap;
    }
    .topo a { color: #aaa; text-decoration: none; font-size: 14px; white-space: nowrap; }
    .topo a:hover { color: white; }
    .topo-titulo {
      flex: 1; text-align: center; font-size: 14px;
      color: #ccc; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; min-width: 0;
    }
    .controles { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ctrl-btn {
      background: #222; color: white; border: none;
      border-radius: 6px; padding: 6px 12px; font-size: 13px;
      cursor: pointer; transition: background 0.15s; white-space: nowrap;
    }
    .ctrl-btn:hover { background: #444; }
    .ctrl-btn.ativo { background: #ffd700; color: #111; }

    .ir-pagina { display: flex; align-items: center; gap: 5px; }
    .ir-pagina input {
      width: 52px; padding: 5px 7px; font-size: 13px;
      border-radius: 6px; border: 1px solid #444;
      background: #222; color: white; text-align: center;
    }
    .ir-pagina input:focus { outline: 2px solid #888; }
    .pagina-info { font-size: 12px; color: #888; white-space: nowrap; }

    /* ── Viewer ── */
    #viewer { max-width: 900px; margin: auto; padding: 10px; }
    .page { margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; scroll-margin-top: 70px; }
    canvas { width: 100%; background: white; border-radius: 5px; box-shadow: 0 0 8px rgba(0,0,0,0.6); }
    .placeholder { width: 100%; height: 900px; background: #222; border-radius: 5px; }
    #erro { text-align: center; padding: 40px; color: #f66; }
    .page.destaque canvas { box-shadow: 0 0 0 3px #ffd700, 0 0 16px rgba(255,215,0,0.4); }

    /* ── Indicador de anotação na página ── */
    .nota-badge {
      align-self: flex-end;
      margin-top: 4px; margin-right: 4px;
      background: #ffd700; color: #111;
      border-radius: 12px; padding: 2px 9px;
      font-size: 11px; font-weight: bold;
      cursor: pointer; user-select: none;
      transition: transform 0.1s;
    }
    .nota-badge:hover { transform: scale(1.08); }

    /* ── Drawer de anotações ── */
    #drawer {
      position: fixed; top: 0; right: -420px;
      width: 400px; max-width: 95vw; height: 100vh;
      background: #1a1a1a; z-index: 30;
      box-shadow: -4px 0 24px rgba(0,0,0,0.7);
      transition: right 0.3s ease;
      display: flex; flex-direction: column;
    }
    #drawer.aberto { right: 0; }

    .drawer-header {
      padding: 16px 18px; background: #111;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #2a2a2a; flex-shrink: 0;
    }
    .drawer-header h3 { margin: 0; font-size: 15px; color: #eee; }
    .drawer-fechar {
      background: none; border: none; color: #888;
      font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1;
    }
    .drawer-fechar:hover { color: white; }

    /* ── Área de edição da anotação atual ── */
    .nota-atual {
      padding: 16px 18px; border-bottom: 1px solid #2a2a2a; flex-shrink: 0;
    }
    .nota-atual label {
      font-size: 12px; color: #888; display: block; margin-bottom: 6px;
    }
    .nota-atual textarea {
      width: 100%; box-sizing: border-box;
      background: #2a2a2a; color: #eee; border: 1px solid #333;
      border-radius: 8px; padding: 10px; font-size: 14px;
      resize: vertical; min-height: 100px; font-family: Arial, sans-serif;
    }
    .nota-atual textarea:focus { outline: none; border-color: #ffd700; }
    .nota-atual-btns {
      display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end;
    }
    .btn-salvar {
      background: #ffd700; color: #111; border: none;
      border-radius: 6px; padding: 7px 16px; font-size: 13px;
      font-weight: bold; cursor: pointer; transition: background 0.15s;
    }
    .btn-salvar:hover { background: #ffe44d; }
    .btn-salvar:disabled { background: #555; color: #999; cursor: not-allowed; }
    .btn-apagar {
      background: #3a1a1a; color: #f88; border: 1px solid #622;
      border-radius: 6px; padding: 7px 12px; font-size: 13px;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-apagar:hover { background: #4a2020; }
    .salvo-msg { font-size: 12px; color: #8f8; align-self: center; opacity: 0; transition: opacity 0.3s; }
    .salvo-msg.visivel { opacity: 1; }

    /* ── Lista de todas as anotações ── */
    .notas-lista { flex: 1; overflow-y: auto; padding: 14px 18px; }
    .notas-lista h4 { font-size: 12px; color: #666; margin: 0 0 12px; text-transform: uppercase; }
    .nota-item {
      background: #222; border-radius: 8px; padding: 10px 12px;
      margin-bottom: 10px; cursor: pointer; transition: background 0.15s;
      border-left: 3px solid #ffd700;
    }
    .nota-item:hover { background: #2a2a2a; }
    .nota-item-pag { font-size: 11px; color: #ffd700; font-weight: bold; margin-bottom: 4px; }
    .nota-item-texto { font-size: 13px; color: #ccc; white-space: pre-wrap; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .notas-vazia { color: #555; font-size: 13px; text-align: center; margin-top: 30px; }

    /* ── Overlay escuro ao abrir drawer ── */
    #overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 25;
    }
    #overlay.visivel { display: block; }

    /* ── Sem login ── */
    .sem-login {
      padding: 20px 18px; color: #888; font-size: 13px; text-align: center;
    }
    .sem-login a { color: #ffd700; }

    /* ── Exportar ── */
    .btn-exportar-todas {
      background: #2a2a2a; color: #ffd700; border: 1px solid #444;
      border-radius: 6px; padding: 4px 10px; font-size: 11px;
      cursor: pointer; white-space: nowrap; transition: background 0.15s;
    }
    .btn-exportar-todas:hover { background: #333; }

    .nota-item-exportar {
      background: none; border: none; color: #666;
      font-size: 11px; cursor: pointer; padding: 2px 6px;
      border-radius: 4px; transition: color 0.15s;
      flex-shrink: 0;
    }
    .nota-item-exportar:hover { color: #ffd700; }

    /* ── Modal de exportação ── */
    #modal-exportar {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 50;
      align-items: center; justify-content: center;
    }
    #modal-exportar.aberto { display: flex; }
    .modal-exp {
      background: #1a1a1a; border-radius: 14px;
      padding: 28px 24px; width: 90%; max-width: 480px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    }
    .modal-exp h3 { margin: 0 0 6px; font-size: 16px; color: #eee; }
    .modal-exp p  { margin: 0 0 16px; font-size: 12px; color: #888; }
    .modal-exp textarea {
      width: 100%; box-sizing: border-box;
      background: #111; color: #ccc; border: 1px solid #333;
      border-radius: 8px; padding: 12px; font-size: 13px;
      font-family: monospace; resize: vertical; min-height: 200px;
    }
    .modal-exp-btns {
      display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px;
    }
    .btn-fechar-exp {
      background: #2a2a2a; color: #aaa; border: none;
      border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer;
    }
    .btn-fechar-exp:hover { background: #333; }
    .btn-dl-txt {
      background: #ffd700; color: #111; border: none;
      border-radius: 6px; padding: 8px 16px; font-size: 13px;
      font-weight: bold; cursor: pointer;
    }
    .btn-dl-txt:hover { background: #ffe44d; }

    @media (max-width: 600px) {
      .topo-titulo { display: none; }
      .ctrl-btn { padding: 6px 9px; font-size: 12px; }
      #drawer { width: 100vw; max-width: 100vw; }
    }
  </style>
</head>
<body>

<div class="topo">
  <a href="javascript:history.back()">← Voltar</a>
  <span class="topo-titulo"><a href="index.html" style="color:inherit;text-decoration:none;">Stronghold Library</a> — Leitor</span>
  <div class="controles">
    <div class="ir-pagina">
      <input id="input-pagina" type="number" min="1" placeholder="Pág." title="Ir para página">
      <button class="ctrl-btn" onclick="irParaPagina()">Ir</button>
      <span class="pagina-info" id="pagina-info">Pág. — / —</span>
    </div>
    <button class="ctrl-btn" id="btn-notas" onclick="toggleDrawer()" title="Minhas anotações">📝 Notas</button>
    <button class="ctrl-btn" onclick="baixarPDF()" title="Baixar PDF">⬇ Download</button>
    <div id="btn-conta-wrap" style="position:relative"></div>
  </div>
</div>

<div id="viewer"></div>
<div id="erro" style="display:none"></div>

<!-- ── Overlay ── -->
<div id="overlay" onclick="fecharDrawer()"></div>

<!-- ── Drawer de anotações ── -->
<div id="drawer">
  <div class="drawer-header">
    <h3>📝 Anotações</h3>
    <button class="drawer-fechar" onclick="fecharDrawer()">✕</button>
  </div>

  <!-- Conteúdo quando logado -->
  <div id="drawer-logado" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
    <div class="nota-atual">
      <label id="nota-label">Anotação — Pág. ?</label>
      <textarea id="nota-texto" placeholder="Escreva sua anotação para esta página..."></textarea>
      <div class="nota-atual-btns">
        <span class="salvo-msg" id="salvo-msg">✓ Salvo</span>
        <button class="btn-apagar" onclick="apagarNota()">🗑 Apagar</button>
        <button class="btn-salvar" id="btn-salvar" onclick="salvarNota()">Salvar</button>
      </div>
    </div>
    <div class="notas-lista">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <h4 style="margin:0;">Todas as anotações</h4>
        <button class="btn-exportar-todas" onclick="exportarTodas()" title="Exportar todas como .txt">⬇ Exportar todas</button>
      </div>
      <div id="lista-notas"></div>
    </div>
  </div>

  <!-- Conteúdo quando não logado -->
  <div id="drawer-sem-login" class="sem-login" style="display:none;">
    <p>Para fazer anotações, você precisa estar logado.</p>
    <a href="login.html">Fazer login →</a>
  </div>
</div>

<!-- ── Modal de exportação ── -->
<div id="modal-exportar" onclick="fecharModalExpOverlay(event)">
  <div class="modal-exp">
    <h3 id="modal-exp-titulo">Exportar anotação</h3>
    <p id="modal-exp-sub"></p>
    <textarea id="modal-exp-texto" readonly></textarea>
    <div class="modal-exp-btns">
      <button class="btn-fechar-exp" onclick="fecharModalExp()">Fechar</button>
      <button class="btn-dl-txt" onclick="baixarTxt()">⬇ Baixar .txt</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
  const API    = "https://edischinho-github-io.onrender.com"
  const params = new URLSearchParams(window.location.search)
  const pdfUrl = params.get("pdf")
  const viewer = document.getElementById("viewer")
  let pdfDoc   = null

  // ── Sessão — lida do Supabase SDK ──
  let userId   = null
  let username = null
  let logado   = false

  // Anotações: { pagina: texto }
  let anotacoes      = {}
  let paginaNoDrawer = 1

  // Inicializa sessão e então carrega tudo
  async function init() {
    const { data } = await _supa.auth.getSession()
    if (data.session) {
      userId   = data.session.user.id
      username = data.session.user.user_metadata?.username
              || data.session.user.email.split("@")[0]
      logado   = true
      // Mantém localStorage sincronizado para as outras páginas exibirem o nome
      localStorage.setItem("sl_role",     "user")
      localStorage.setItem("sl_username", username)
    }

    if (!pdfUrl) {
      mostrarErro("Nenhum arquivo especificado.")
    } else {
      carregarPDF(decodeURIComponent(pdfUrl))
      carregarAnotacoes()
    }
  }

  init()

  // ── Carregar PDF ──
  function carregarPDF(url) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"

    pdfjsLib.getDocument(url).promise
      .then(pdf => {
        pdfDoc = pdf
        document.getElementById("pagina-info").textContent = `Pág. 1 / ${pdf.numPages}`
        document.getElementById("input-pagina").max = pdf.numPages

        for (let i = 1; i <= pdf.numPages; i++) {
          const pageDiv = document.createElement("div")
          pageDiv.className  = "page"
          pageDiv.dataset.page = i
          const placeholder = document.createElement("div")
          placeholder.className = "placeholder"
          pageDiv.appendChild(placeholder)
          viewer.appendChild(pageDiv)
          observer.observe(pageDiv)
        }

        // Restaurar última página lida
        const chave        = "sl_pagina_" + btoa(pdfUrl).slice(0, 40)
        const ultimaPagina = parseInt(localStorage.getItem(chave))
        if (ultimaPagina && ultimaPagina > 1 && ultimaPagina <= pdf.numPages) {
          // Pequeno delay para o DOM montar os placeholders
          setTimeout(() => {
            document.getElementById("input-pagina").value = ultimaPagina
            irParaPagina()
          }, 200)
        }
      })
      .catch(err => mostrarErro("Erro ao carregar o PDF: " + err.message))
  }

  // ── Página atual ──
  function paginaVisivel() {
    const pages   = viewer.querySelectorAll(".page")
    const alturaVP = window.innerHeight
    let max = 0, atual = 1
    pages.forEach(p => {
      const r = p.getBoundingClientRect()
      const vis = Math.max(Math.min(r.bottom, alturaVP) - Math.max(r.top, 0), 0)
      if (vis > max) { max = vis; atual = parseInt(p.dataset.page) }
    })
    return atual
  }

  function atualizarPaginaAtual() {
    if (!pdfDoc) return
    const num = paginaVisivel()
    document.getElementById("pagina-info").textContent = `Pág. ${num} / ${pdfDoc.numPages}`
    // Sincroniza drawer se estiver aberto
    if (document.getElementById("drawer").classList.contains("aberto")) {
      abrirDrawerNaPagina(num)
    }
  }

  let navegando = false, scrollTimer = null
  window.addEventListener("scroll", () => {
    if (navegando) return
    if (scrollTimer) return
    scrollTimer = setTimeout(() => {
      atualizarPaginaAtual()
      // Salva página atual no localStorage com chave única por livro
      if (pdfDoc && pdfUrl) {
        const chave = "sl_pagina_" + btoa(pdfUrl).slice(0, 40)
        localStorage.setItem(chave, paginaVisivel())
      }
      scrollTimer = null
    }, 80)
  }, { passive: true })

  // Salva também ao sair/fechar a aba
  window.addEventListener("beforeunload", () => {
    if (pdfDoc && pdfUrl) {
      const chave = "sl_pagina_" + btoa(pdfUrl).slice(0, 40)
      localStorage.setItem(chave, paginaVisivel())
    }
  })

  // ── Lazy loading ──
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const pageDiv   = entry.target
        const pageIndex = [...viewer.children].indexOf(pageDiv) + 1
        renderPage(pageIndex, pageDiv)
        observer.unobserve(pageDiv)
      }
    })
  }, { rootMargin: "300px" })

  function renderPage(num, container) {
    pdfDoc.getPage(num).then(page => {
      const scale    = window.innerWidth < 600 ? 1.0 : 1.5
      const viewport = page.getViewport({ scale })
      const canvas   = document.createElement("canvas")
      const ctx      = canvas.getContext("2d")
      canvas.height  = viewport.height
      canvas.width   = viewport.width
      container.innerHTML = ""
      container.appendChild(canvas)
      page.render({ canvasContext: ctx, viewport })
      // Adiciona badge se tiver anotação
      if (logado) atualizarBadge(num, container)
    })
  }

  // ── Ir para página ──
  let animacaoScroll = null
  function irParaPagina() {
    if (!pdfDoc) return
    const input = document.getElementById("input-pagina")
    let num = parseInt(input.value)
    if (isNaN(num) || num < 1) num = 1
    if (num > pdfDoc.numPages)  num = pdfDoc.numPages
    input.value = num

    const alvo = viewer.querySelector(`.page[data-page="${num}"]`)
    if (!alvo) return

    navegando = true
    document.getElementById("pagina-info").textContent = `Pág. ${num} / ${pdfDoc.numPages}`

    for (let v = Math.max(1, num - 2); v <= Math.min(pdfDoc.numPages, num + 2); v++) {
      const viz = viewer.querySelector(`.page[data-page="${v}"]`)
      if (viz && viz.querySelector(".placeholder")) { renderPage(v, viz); observer.unobserve(viz) }
    }

    viewer.style.transition = "opacity 0.15s ease"
    viewer.style.opacity    = "0"

    setTimeout(() => {
      const topoAlvo = alvo.getBoundingClientRect().top + window.scrollY - 60
      window.scrollTo(0, topoAlvo)
      requestAnimationFrame(() => {
        const topoFinal = alvo.getBoundingClientRect().top + window.scrollY - 60
        window.scrollTo(0, topoFinal)
        viewer.style.opacity = "1"
        setTimeout(() => {
          viewer.style.transition = ""
          navegando = false
          document.getElementById("pagina-info").textContent = `Pág. ${num} / ${pdfDoc.numPages}`
          destacar(alvo)
          if (document.getElementById("drawer").classList.contains("aberto")) abrirDrawerNaPagina(num)
        }, 150)
      })
    }, 150)
  }

  function destacar(el) {
    el.classList.add("destaque")
    setTimeout(() => el.classList.remove("destaque"), 1800)
  }

  document.getElementById("input-pagina").addEventListener("keydown", e => {
    if (e.key === "Enter") irParaPagina()
  })

  // ── Download ──
  async function baixarPDF() {
    const url = decodeURIComponent(pdfUrl)
    try {
      const res  = await fetch(url)
      const blob = await res.blob()
      const a    = document.createElement("a")
      a.href     = URL.createObjectURL(blob)
      a.download = url.split("/").pop().replace(/^\d+-/, "") || "livro.pdf"
      a.click()
      URL.revokeObjectURL(a.href)
    } catch { window.open(url, "_blank") }
  }

  // ─────────────────────────────────────────────
  // ── ANOTAÇÕES — Supabase (logado) ou localStorage (offline) ──
  // ─────────────────────────────────────────────

  function chaveLocal() {
    return "sl_notas_" + btoa(pdfUrl).slice(0, 40)
  }

  // ── Carrega: Supabase se logado, localStorage se não ──
  async function carregarAnotacoes() {
    if (logado && userId) {
      try {
        const res  = await fetch(`${API}/anotacoes?user_id=${encodeURIComponent(userId)}&livro_url=${encodeURIComponent(pdfUrl)}`)
        if (!res.ok) throw new Error()
        anotacoes = await res.json()
        // Sincroniza localStorage com o que veio do servidor
        localStorage.setItem(chaveLocal(), JSON.stringify(anotacoes))
      } catch {
        // Fallback: usa cache local se o servidor falhar
        try { anotacoes = JSON.parse(localStorage.getItem(chaveLocal()) || "{}") }
        catch { anotacoes = {} }
      }
    } else {
      try { anotacoes = JSON.parse(localStorage.getItem(chaveLocal()) || "{}") }
      catch { anotacoes = {} }
    }

    viewer.querySelectorAll(".page").forEach(p => {
      atualizarBadge(parseInt(p.dataset.page), p)
    })
    renderizarListaNotas()
  }

  // ── Persiste: Supabase + localStorage (sempre os dois) ──
  async function persistirAnotacoes() {
    // localStorage sempre — garante cache offline
    try { localStorage.setItem(chaveLocal(), JSON.stringify(anotacoes)) }
    catch {}

    // Supabase só se logado
    if (!logado || !userId) return

    // Envia em paralelo todas as anotações modificadas
    // Estratégia: reenvia o estado inteiro da página que mudou (última salva)
    // (a rota já faz upsert, então é idempotente)
  }

  // Badge amarelo embaixo da página
  function atualizarBadge(num, container) {
    const existente = container.querySelector(".nota-badge")
    if (existente) existente.remove()

    if (anotacoes[num]) {
      const badge = document.createElement("div")
      badge.className   = "nota-badge"
      badge.textContent = "📝 Anotação"
      badge.onclick     = () => { abrirDrawerNaPagina(num); abrirDrawer() }
      container.appendChild(badge)
    }
  }

  // ── Drawer ──
  function toggleDrawer() {
    const drawer = document.getElementById("drawer")
    if (drawer.classList.contains("aberto")) {
      fecharDrawer()
    } else {
      abrirDrawer()
    }
  }

  function abrirDrawer() {
    const drawer  = document.getElementById("drawer")
    const overlay = document.getElementById("overlay")
    const btn     = document.getElementById("btn-notas")

    drawer.classList.add("aberto")
    overlay.classList.add("visivel")
    btn.classList.add("ativo")

    // Anotações sempre disponíveis — não exigem login
    document.getElementById("drawer-logado").style.display    = "flex"
    document.getElementById("drawer-sem-login").style.display = "none"
    abrirDrawerNaPagina(paginaVisivel())
  }

  function fecharDrawer() {
    document.getElementById("drawer").classList.remove("aberto")
    document.getElementById("overlay").classList.remove("visivel")
    document.getElementById("btn-notas").classList.remove("ativo")
  }

  // Sincroniza o textarea com a página indicada
  function abrirDrawerNaPagina(num) {
    paginaNoDrawer = num
    document.getElementById("nota-label").textContent  = `Anotação — Pág. ${num}`
    document.getElementById("nota-texto").value        = anotacoes[num] || ""
    document.getElementById("salvo-msg").classList.remove("visivel")
  }

  // ── Salvar — localStorage imediato + Supabase em background ──
  async function salvarNota() {
    const texto = document.getElementById("nota-texto").value.trim()
    const btn   = document.getElementById("btn-salvar")
    btn.disabled = true; btn.textContent = "Salvando..."

    // 1. Atualiza estado local
    if (texto) {
      anotacoes[paginaNoDrawer] = texto
    } else {
      delete anotacoes[paginaNoDrawer]
    }

    // 2. Grava no localStorage imediatamente (resposta instantânea)
    try { localStorage.setItem(chaveLocal(), JSON.stringify(anotacoes)) } catch {}

    // 3. Sincroniza com Supabase em background se logado
    if (logado && userId) {
      try {
        await fetch(`${API}/anotacoes`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id:   userId,
            livro_url: pdfUrl,
            pagina:    paginaNoDrawer,
            texto:     texto
          })
        })
      } catch {
        // Silencioso — o localStorage já garantiu a persistência local
        console.warn("Supabase offline, anotação salva só localmente.")
      }
    }

    // 4. Atualiza UI
    const pageDiv = viewer.querySelector(`.page[data-page="${paginaNoDrawer}"]`)
    if (pageDiv) atualizarBadge(paginaNoDrawer, pageDiv)
    renderizarListaNotas()

    const msg = document.getElementById("salvo-msg")
    msg.classList.add("visivel")
    setTimeout(() => msg.classList.remove("visivel"), 2000)

    btn.disabled = false; btn.textContent = "Salvar"
  }

  // ── Apagar ──
  async function apagarNota() {
    document.getElementById("nota-texto").value = ""
    await salvarNota()
  }

  // ── Lista lateral ──
  function renderizarListaNotas() {
    const lista  = document.getElementById("lista-notas")
    const paginas = Object.keys(anotacoes).map(Number).sort((a, b) => a - b)

    if (!paginas.length) {
      lista.innerHTML = '<p class="notas-vazia">Nenhuma anotação ainda.</p>'
      return
    }

    lista.innerHTML = paginas.map(p => `
      <div class="nota-item" style="display:flex;align-items:flex-start;gap:6px;">
        <div style="flex:1;cursor:pointer;" onclick="irParaNota(${p})">
          <div class="nota-item-pag">Página ${p}</div>
          <div class="nota-item-texto">${escapeHtml(anotacoes[p])}</div>
        </div>
        <button class="nota-item-exportar" onclick="exportarUma(${p})" title="Exportar esta anotação">⬇</button>
      </div>
    `).join("")
  }

  function irParaNota(num) {
    abrirDrawerNaPagina(num)
    // Navega para a página sem fechar o drawer
    document.getElementById("input-pagina").value = num
    irParaPagina()
  }

  // ─────────────────────────────────────────────
  // ── EXPORTAÇÃO ──
  // ─────────────────────────────────────────────

  let expTextoAtual  = ""
  let expNomeArquivo = "anotacao.txt"

  // Nome limpo do livro para o arquivo
  function nomeDoLivro() {
    try {
      const url  = decodeURIComponent(pdfUrl)
      const base = url.split("/").pop().replace(/^\d+-/, "").replace(/\.pdf$/i, "")
      return base.replace(/_/g, " ") || "livro"
    } catch { return "livro" }
  }

  // Exportar anotação de uma página específica
  function exportarUma(pagina) {
    const texto = anotacoes[pagina]
    if (!texto) return

    const livro   = nomeDoLivro()
    const conteudo = [
      `Stronghold Library — Anotações`,
      `Livro : ${livro}`,
      `Página: ${pagina}`,
      ``,
      texto
    ].join("\n")

    expTextoAtual  = conteudo
    expNomeArquivo = `${livro}_pag${pagina}.txt`

    document.getElementById("modal-exp-titulo").textContent = `Exportar — Pág. ${pagina}`
    document.getElementById("modal-exp-sub").textContent    = `Anotação da página ${pagina} de "${livro}"`
    document.getElementById("modal-exp-texto").value        = conteudo
    document.getElementById("modal-exportar").classList.add("aberto")
  }

  // Exportar todas as anotações de uma vez
  function exportarTodas() {
    const paginas = Object.keys(anotacoes).map(Number).sort((a, b) => a - b)
    if (!paginas.length) { alert("Nenhuma anotação para exportar."); return }

    const livro = nomeDoLivro()
    const linhas = [
      `Stronghold Library — Anotações`,
      `Livro : ${livro}`,
      `Total : ${paginas.length} anotação${paginas.length > 1 ? "ões" : ""}`,
      ``,
      `${"─".repeat(50)}`
    ]

    paginas.forEach(p => {
      linhas.push(``, `[ Página ${p} ]`, ``, anotacoes[p], `${"─".repeat(50)}`)
    })

    expTextoAtual  = linhas.join("\n")
    expNomeArquivo = `${livro}_anotacoes.txt`

    document.getElementById("modal-exp-titulo").textContent = `Exportar todas (${paginas.length})`
    document.getElementById("modal-exp-sub").textContent    = `${paginas.length} anotaç${paginas.length > 1 ? "ões" : "ão"} de "${livro}"`
    document.getElementById("modal-exp-texto").value        = expTextoAtual
    document.getElementById("modal-exportar").classList.add("aberto")
  }

  function baixarTxt() {
    const blob = new Blob([expTextoAtual], { type: "text/plain;charset=utf-8" })
    const a    = document.createElement("a")
    a.href     = URL.createObjectURL(blob)
    a.download = expNomeArquivo
    a.click()
    URL.revokeObjectURL(a.href)
  }

  function fecharModalExp() {
    document.getElementById("modal-exportar").classList.remove("aberto")
  }

  // Fechar ao clicar no fundo escuro (fora do card)
  function fecharModalExpOverlay(e) {
    if (e.target === document.getElementById("modal-exportar")) fecharModalExp()
  }

  // Fechar modal com Escape
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") fecharModalExp()
  })

  function escapeHtml(t) {
    return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  }

  // Salvar com Ctrl+Enter no textarea
  document.getElementById("nota-texto").addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); salvarNota() }
  })

  // ── Erro ──
  function mostrarErro(msg) {
    viewer.style.display = "none"
    const el = document.getElementById("erro")
    el.textContent = msg; el.style.display = "block"
  }
</script>

<script>
(function() {
  const wrap     = document.getElementById("btn-conta-wrap")
  const btnStyle = "background:#222;color:#eee;border:none;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;"

  // Lê sessão do Supabase SDK para decidir o que mostrar
  _supa.auth.getSession().then(({ data }) => {
    const session  = data.session
    const role     = localStorage.getItem("sl_role")  // admin não tem sessão Supabase
    const isAdmin  = role === "admin"
    const uname    = session
      ? (session.user.user_metadata?.username || session.user.email.split("@")[0])
      : (isAdmin ? "admin" : null)
    const logado   = !!(session || isAdmin)

    if (logado) {
      wrap.innerHTML = `
        <button id="conta-btn" style="${btnStyle}display:flex;align-items:center;gap:6px;">
          👤 ${uname || "Conta"} ▾
        </button>
        <div id="conta-menu" style="display:none;position:absolute;right:0;top:110%;background:#222;border:1px solid #444;border-radius:8px;min-width:150px;box-shadow:0 4px 16px rgba(0,0,0,0.6);z-index:100;">
          <div style="padding:10px 14px;font-size:12px;color:#888;border-bottom:1px solid #333;">${uname}</div>
          <button onclick="sairConta()" style="width:100%;text-align:left;background:none;border:none;color:#f88;padding:10px 14px;font-size:13px;cursor:pointer;">🚪 Sair</button>
        </div>`
      document.getElementById("conta-btn").addEventListener("click", (e) => {
        e.stopPropagation()
        const m = document.getElementById("conta-menu")
        m.style.display = m.style.display === "none" ? "block" : "none"
      })
      document.addEventListener("click", () => {
        const m = document.getElementById("conta-menu")
        if (m) m.style.display = "none"
      })
    } else {
      wrap.innerHTML = `<button onclick="location.href='login.html'" style="${btnStyle}background:#fff;color:#111;font-weight:bold;">Entrar</button>`
    }
  })

  async function sairConta() {
    await _supa.auth.signOut()
    ;["sl_role","sl_username"].forEach(k => localStorage.removeItem(k))
    location.href = "index.html"
  }
  window.sairConta = sairConta
})()
</script>
