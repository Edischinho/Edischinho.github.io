<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor — Stronghold Library</title>
  <style>
    body { margin: 0; background: #111; font-family: Arial, sans-serif; color: white; }

    /* ── Barra superior ── */
    .topo {
      position: sticky; top: 0; background: #000;
      padding: 10px 16px; display: flex; align-items: center;
      gap: 10px; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      flex-wrap: wrap;
    }
    .topo a {
      color: #aaa; text-decoration: none; font-size: 14px;
      white-space: nowrap;
    }
    .topo a:hover { color: white; }
    .topo-titulo {
      flex: 1; text-align: center; font-size: 14px;
      color: #ccc; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; min-width: 0;
    }

    /* ── Controles ── */
    .controles {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .ctrl-btn {
      background: #222; color: white; border: none;
      border-radius: 6px; padding: 6px 12px; font-size: 13px;
      cursor: pointer; transition: background 0.15s; white-space: nowrap;
    }
    .ctrl-btn:hover { background: #444; }

    /* ── Input ir para página ── */
    .ir-pagina {
      display: flex; align-items: center; gap: 5px;
    }
    .ir-pagina input {
      width: 52px; padding: 5px 7px; font-size: 13px;
      border-radius: 6px; border: 1px solid #444;
      background: #222; color: white; text-align: center;
    }
    .ir-pagina input:focus { outline: 2px solid #888; }
    .pagina-info { font-size: 12px; color: #888; white-space: nowrap; }

    /* ── Viewer ── */
    #viewer { max-width: 900px; margin: auto; padding: 10px; }
    .page   { margin-bottom: 20px; display: flex; justify-content: center; scroll-margin-top: 70px; }
    canvas  { width: 100%; background: white; border-radius: 5px; box-shadow: 0 0 8px rgba(0,0,0,0.6); }
    .placeholder { width: 100%; height: 900px; background: #222; border-radius: 5px; }

    #erro { text-align: center; padding: 40px; color: #f66; }

    /* ── Highlight de página alvo ── */
    .page.destaque canvas {
      box-shadow: 0 0 0 3px #ffd700, 0 0 16px rgba(255,215,0,0.4);
    }

    @media (max-width: 600px) {
      .topo-titulo { display: none; }
      .ctrl-btn { padding: 6px 9px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="topo">
  <a href="javascript:history.back()">← Voltar</a>

  <span class="topo-titulo">Stronghold Library — Leitor</span>

  <div class="controles">
    <!-- Ir para página -->
    <div class="ir-pagina">
      <input id="input-pagina" type="number" min="1" placeholder="Pág." title="Ir para página">
      <button class="ctrl-btn" onclick="irParaPagina()">Ir</button>
      <span class="pagina-info" id="pagina-info">Pág. — / —</span>
    </div>

    <!-- Download -->
    <button class="ctrl-btn" onclick="baixarPDF()" title="Baixar PDF">⬇ Download</button>
  </div>
</div>

<div id="viewer"></div>
<div id="erro" style="display:none"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  const params = new URLSearchParams(window.location.search)
  const pdfUrl = params.get("pdf")
  const viewer = document.getElementById("viewer")
  let pdfDoc   = null

  if (!pdfUrl) {
    mostrarErro("Nenhum arquivo especificado.")
  } else {
    carregarPDF(decodeURIComponent(pdfUrl))
  }

  // ── Carregar PDF ──
  function carregarPDF(url) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"

    pdfjsLib.getDocument(url).promise
      .then(pdf => {
        pdfDoc = pdf
        document.getElementById("pagina-info").textContent = `Pág. 1 / ${pdf.numPages}`
        document.getElementById("input-pagina").max = pdf.numPages

        for (let i = 1; i <= pdf.numPages; i++) {
          const pageDiv = document.createElement("div")
          pageDiv.className = "page"
          pageDiv.dataset.page = i
          const placeholder = document.createElement("div")
          placeholder.className = "placeholder"
          pageDiv.appendChild(placeholder)
          viewer.appendChild(pageDiv)
          observer.observe(pageDiv)
        }
      })
      .catch(err => mostrarErro("Erro ao carregar o PDF: " + err.message))
  }

  // ── Página atual: scroll + getBoundingClientRect (100% preciso) ──
  // A página atual é a que ocupa mais pixels visíveis na viewport
  function atualizarPaginaAtual() {
    if (!pdfDoc) return
    const pages      = viewer.querySelectorAll(".page")
    const alturaVP   = window.innerHeight
    let   maxVisivel = 0
    let   paginaAtual = 1

    pages.forEach(p => {
      const rect    = p.getBoundingClientRect()
      const topo    = Math.max(rect.top,    0)
      const base    = Math.min(rect.bottom, alturaVP)
      const visivel = Math.max(base - topo, 0)

      if (visivel > maxVisivel) {
        maxVisivel  = visivel
        paginaAtual = parseInt(p.dataset.page)
      }
    })

    document.getElementById("pagina-info").textContent =
      `Pág. ${paginaAtual} / ${pdfDoc.numPages}`
  }

  // Flag: suspende o contador durante navegação programática
  let navegando   = false
  let scrollTimer = null

  window.addEventListener("scroll", () => {
    // Enquanto estiver navegando via "Ir", ignora scroll intermediário
    if (navegando) return

    if (scrollTimer) return
    scrollTimer = setTimeout(() => {
      atualizarPaginaAtual()
      scrollTimer = null
    }, 80)
  }, { passive: true })

  // ── Lazy loading ──
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const pageDiv   = entry.target
        const pageIndex = [...viewer.children].indexOf(pageDiv) + 1
        renderPage(pageIndex, pageDiv)
        observer.unobserve(pageDiv)
      }
    })
  }, { rootMargin: "300px" })

  function renderPage(num, container) {
    pdfDoc.getPage(num).then(page => {
      const scale    = window.innerWidth < 600 ? 1.0 : 1.5
      const viewport = page.getViewport({ scale })
      const canvas   = document.createElement("canvas")
      const ctx      = canvas.getContext("2d")
      canvas.height  = viewport.height
      canvas.width   = viewport.width
      container.innerHTML = ""
      container.appendChild(canvas)
      page.render({ canvasContext: ctx, viewport })
    })
  }

  // ── Ir para página ──
  let animacaoScroll = null

  function irParaPagina() {
    if (!pdfDoc) return

    const input = document.getElementById("input-pagina")
    let num = parseInt(input.value)

    if (isNaN(num) || num < 1) num = 1
    if (num > pdfDoc.numPages) num = pdfDoc.numPages
    input.value = num

    const alvo = viewer.querySelector(`.page[data-page="${num}"]`)
    if (!alvo) return

    // Cancela animação anterior
    if (animacaoScroll) { cancelAnimationFrame(animacaoScroll); animacaoScroll = null }
    navegando = true

    // Atualiza contador imediatamente
    document.getElementById("pagina-info").textContent = `Pág. ${num} / ${pdfDoc.numPages}`

    // Renderiza a página alvo e as 2 vizinhas para garantir alturas reais
    for (let v = Math.max(1, num - 2); v <= Math.min(pdfDoc.numPages, num + 2); v++) {
      const vizinho = viewer.querySelector(`.page[data-page="${v}"]`)
      if (vizinho && vizinho.querySelector(".placeholder")) {
        renderPage(v, vizinho)
        observer.unobserve(vizinho)
      }
    }

    // Aguarda 1 frame para o DOM refletir as alturas reais dos canvas renderizados
    requestAnimationFrame(() => {
      const paginaAtual = parseInt(
        (() => {
          // descobre página atual pelo scroll antes de mover
          const pages = viewer.querySelectorAll(".page")
          const vp    = window.innerHeight
          let max = 0, cur = 1
          pages.forEach(p => {
            const r  = p.getBoundingClientRect()
            const vis = Math.max(Math.min(r.bottom, vp) - Math.max(r.top, 0), 0)
            if (vis > max) { max = vis; cur = parseInt(p.dataset.page) }
          })
          return cur
        })()
      )

      const distPaginas = Math.abs(num - paginaAtual)

      if (distPaginas <= 15) {
        // ── Curta distância: scroll animado com rAF ──
        const inicio   = window.scrollY
        const topoAlvo = alvo.getBoundingClientRect().top + window.scrollY - 60
        const distancia = topoAlvo - inicio
        const duracao   = Math.min(300 + distPaginas * 18, 600)
        let   startTime = null

        function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t }

        function passo(timestamp) {
          if (!startTime) startTime = timestamp
          const prog = Math.min((timestamp - startTime) / duracao, 1)
          window.scrollTo(0, inicio + distancia * easeInOut(prog))
          if (prog < 1) {
            animacaoScroll = requestAnimationFrame(passo)
          } else {
            animacaoScroll = null
            navegando = false
            document.getElementById("pagina-info").textContent = `Pág. ${num} / ${pdfDoc.numPages}`
            destacar(alvo)
          }
        }
        animacaoScroll = requestAnimationFrame(passo)

      } else {
        // ── Longa distância: pulo instantâneo ──
        // Posiciona direto sem animação — evita o problema de alturas variáveis
        const topoAlvo = alvo.getBoundingClientRect().top + window.scrollY - 60
        window.scrollTo(0, topoAlvo)

        // Confirma posição no próximo frame (DOM já estabilizado)
        requestAnimationFrame(() => {
          const topoFinal = alvo.getBoundingClientRect().top + window.scrollY - 60
          window.scrollTo(0, topoFinal)
          navegando = false
          document.getElementById("pagina-info").textContent = `Pág. ${num} / ${pdfDoc.numPages}`
          destacar(alvo)
        })
      }
    })
  }

  function destacar(el) {
    el.classList.add("destaque")
    setTimeout(() => el.classList.remove("destaque"), 1800)
  }

  // Enter no campo de página também navega
  document.getElementById("input-pagina").addEventListener("keydown", e => {
    if (e.key === "Enter") irParaPagina()
  })

  // ── Download ──
  async function baixarPDF() {
    const url = decodeURIComponent(pdfUrl)
    try {
      const res  = await fetch(url)
      const blob = await res.blob()
      const a    = document.createElement("a")
      a.href     = URL.createObjectURL(blob)
      // Nome do arquivo a partir da URL
      a.download = url.split("/").pop().replace(/^\d+-/, "") || "livro.pdf"
      a.click()
      URL.revokeObjectURL(a.href)
    } catch (err) {
      // Fallback: abre direto no browser (que oferece o download nativamente)
      window.open(url, "_blank")
    }
  }

  // ── Erro ──
  function mostrarErro(msg) {
    viewer.style.display = "none"
    const el = document.getElementById("erro")
    el.textContent = msg
    el.style.display = "block"
  }
</script>

</body>
</html>
